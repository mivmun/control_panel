{% extends 'panel/base.html' %}
{% load panel_tags %}
{% block content %}
<div class="page-header">
  <h1>{{ form_title }}</h1>
</div>

<div class="form-card">
  <form method="post" id="crud-form">
    {% csrf_token %}
    <div class="form-grid">
      {% for name in fields %}
        <div class="form-group {% if name == 'datos' %}full{% endif %}">
          {% with field=form|get_item:name %}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
              <small style="color: var(--danger);">{{ error }}</small>
            {% endfor %}
          {% endwith %}
        </div>
      {% endfor %}
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-accent">Guardar</button>
      <a class="btn btn-ghost" href="{% url 'list' table %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
