<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puestos Piso 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#e9edf0;--panel:#ffffff;--panel2:#f5f7f8;--ink:#17212b;--muted:#5d6b78;--line:#d3dae0;--hover:#eef2f5;
  --accent:#c2571a;--accent-ink:#ffffff;--accent-soft:#fbe9dd;
  --focus:#c2571a;--danger:#b42318;--ok:#23724a;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171c;--panel:#1a2128;--panel2:#1f272f;--ink:#e4e9ee;--muted:#98a6b3;--line:#2d3741;--hover:#242d36;
  --accent:#f08a4b;--accent-ink:#1a1108;--accent-soft:#3a2518;--focus:#f08a4b;--danger:#f27d72;--ok:#6fcf97;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12171c;--panel:#1a2128;--panel2:#1f272f;--ink:#e4e9ee;--muted:#98a6b3;--line:#2d3741;--hover:#242d36;
  --accent:#f08a4b;--accent-ink:#1a1108;--accent-soft:#3a2518;--focus:#f08a4b;--danger:#f27d72;--ok:#6fcf97;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* ---- rediseño: menos ruido, detalles bajo demanda ---- */
.top{gap:10px 14px}
.brand h1{font-size:18px}
.sync{font-size:11px}
.when{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.when .wk{font-size:13px;color:var(--muted)}
.when .wk button{border:0;background:none;padding:2px 6px}
.when .wk button:hover{background:var(--hover)}
.menu{position:relative}
.menu>summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-weight:500;background:var(--panel);user-select:none}
.menu>summary::-webkit-details-marker{display:none}
.menu>summary:hover{background:var(--hover)}
.menu[open]>summary{background:var(--accent-soft);border-color:var(--accent)}
.menu .mlist{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:200px;display:grid;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.16)}
.menu .mlist button{border:0;text-align:left;padding:8px 10px;border-radius:6px}
.menu .mlist button.on{background:var(--accent-soft)}
.statbar{padding:6px 12px;gap:8px}
.kpis{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.kpi{display:inline-flex;align-items:baseline;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:2px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.kpi b{color:var(--ink);font-size:14px}
.kpi.good{border-color:#b9dcc6}.kpi.warn{border-color:#e7c77c;background:#fdf6e6}.kpi.warn b{color:#6b4a0f}.kpi.bad{border-color:#f0b6ae;background:#fdf0ee}.kpi.bad b{color:#8a1c12}
.kpi button{all:unset;cursor:pointer}
.legend{position:relative}
.legend>summary{list-style:none;cursor:pointer;font-size:13px;color:var(--muted);padding:3px 10px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.legend>summary::-webkit-details-marker{display:none}
.legend[open]>summary{color:var(--ink);border-color:var(--accent)}
.legend .lgpop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 12px 32px rgba(0,0,0,.14);min-width:230px}
.help>summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:8px}
.help[open]>summary{color:var(--ink)}
/* paneles de detalle: se deslizan sobre la lista de personas */
aside{position:relative}
aside.dlg{display:contents}
#elevPane,#roomPane,#seatPane,#editPane{position:absolute;inset:0;z-index:6;background:var(--panel);overflow:auto;box-shadow:-10px 0 28px rgba(0,0,0,.08);animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
aside section h2{font-size:17px}
/* secciones desplegables */
details.cs{border-top:1px solid var(--line);padding:8px 0}
details.cs:first-of-type{border-top:0}
details.cs>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:4px 0}
details.cs>summary::-webkit-details-marker{display:none}
details.cs>summary::before{content:"▸";font-size:11px;transition:transform .15s}
details.cs[open]>summary::before{transform:rotate(90deg)}
details.cs>summary:hover{color:var(--ink)}
details.cs>*:not(summary){margin-top:8px}
/* ventana de administración */
#adminPane,#repPane,#reqPane,#prnPane{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100vw - 32px));max-height:86vh;overflow:auto;z-index:80;border-radius:14px;background:var(--panel);box-shadow:0 0 0 100vmax rgba(15,23,30,.45),0 24px 64px rgba(0,0,0,.35);animation:pop .16s ease-out}
#adminPane .admbox,#repPane .admbox,#reqPane .admbox,#prnPane .admbox{background:var(--panel);border:0}
#prnPane{width:min(860px,calc(100vw - 32px))}
.prnprev{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;max-height:52vh;overflow:auto}
#printSheet{display:none}
@media print{body>*:not(#printSheet){display:none!important}#printSheet{display:block!important}body{background:#fff!important}@page{size:landscape;margin:8mm}}
#repPane .admbox,#reqPane .admbox,#prnPane .admbox{padding:16px 20px 18px}
#repPane h2,#reqPane h2,#prnPane h2{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:18px}
#repPane h2 button,#reqPane h2 button,#prnPane h2 button{border:0;background:none;font-size:16px;cursor:pointer;color:var(--muted)}
#repPane .btns,#reqPane .btns,#prnPane .btns{display:flex;flex-wrap:wrap;gap:8px}
.reqrow{border-top:1px solid var(--line);padding:10px 0}
.reqh{display:flex;align-items:center;gap:8px}
.reqst{font-size:12px;border-radius:10px;padding:1px 8px;background:var(--hover)}
.reqst.pendiente{background:#fff1c9;color:#6b4d00}.reqst.aprobada{background:#e3f4ea;color:#1f6b41}.reqst.rechazada{background:#fde2e1;color:#8f1d15}
.mbadge{display:inline-block;min-width:16px;height:16px;margin-left:6px;border-radius:8px;background:#e8a317;color:#3d2a06;font-size:10px;font-style:normal;font-weight:800;line-height:16px;padding:0 4px;vertical-align:1px}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}
/* ficha de persona: ventana emergente */
.pedit{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100vw - 32px));max-height:88vh;overflow:auto;z-index:80;background:var(--panel);border-radius:14px;padding:16px 18px!important;box-shadow:0 0 0 100vmax rgba(15,23,30,.45),0 24px 64px rgba(0,0,0,.35);animation:pop .16s ease-out}
.pedit .ph{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.pedit .ph b{flex:1;font-size:17px}
@media (prefers-reduced-motion:reduce){#printPane,#elevPane,#roomPane,#seatPane,#editPane,#adminPane,#repPane,#reqPane,#prnPane,.pedit{animation:none}}
@media (max-width:820px){#printPane,#elevPane,#roomPane,#seatPane,#editPane{position:static;box-shadow:none;animation:none}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Barlow",system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500}
button:hover{background:var(--hover)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--danger)}
button.link{border:0;background:none;padding:2px 4px;color:var(--muted);font-size:13px}
button.link:hover{color:var(--ink);background:none;text-decoration:underline}
button:disabled{opacity:.5;cursor:default}
input,select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;min-width:0}

.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;flex-wrap:wrap}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.brand h1 b{font-family:var(--mono);font-weight:600;color:var(--accent)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on::before{background:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;padding:6px 12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button.tf{position:relative}
.seg button.tf::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.notice{padding:8px 16px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:14px}

.app{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.statbar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:8px 16px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:14px}
.lgbtn{border:1px solid transparent;background:none;padding:1px 6px;border-radius:12px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.lgbtn:hover{border-color:var(--line);background:var(--hover)}
.lgbtn[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.statbar b{font-variant-numeric:tabular-nums}
.statbar .gap{flex:1}
.statbar{flex-wrap:nowrap;align-items:center}
.wk{display:inline-flex;align-items:center;gap:4px}
.wk button{padding:2px 8px}
.wk #wkLbl{font-weight:600;min-width:10ch;text-align:center;font-variant-numeric:tabular-nums}
.lg{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.sw{width:14px;height:10px;border-radius:2px;border:1.5px solid}
.cvwrap{flex:1;position:relative;min-height:320px}
svg#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;background:var(--bg)}
svg#cv.panning{cursor:grabbing}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:4px}
.zoom button{width:36px;padding:6px 0}
.pickbar{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1.5px solid var(--accent);border-radius:8px;padding:8px 12px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.pickbar span{flex:1;min-width:180px}

/* puestos: dibujados sobre la hoja blanca del plano, colores fijos */
.st{cursor:pointer}
.st:focus-visible,.room:focus-visible,.elev:focus-visible{outline:2px solid #c2571a;outline-offset:2px}
.st .desk{fill:#ffffff;stroke:#7a8794;stroke-width:1}
.st .chair-b{fill:#ffffff;stroke:#b5bec7;stroke-width:.8}
.st .chair{stroke-width:1.4}
.st.free .chair{fill:#e3f4ea;stroke:#2f8a57}
.st.free .desk{fill:#f3fbf6;stroke:#2f8a57}
.st.occ .chair{fill:#2a5d8c;stroke:#1d4568}
.st.occ .desk{fill:#dce8f4;stroke:#2a5d8c}
.st.part .chair{fill:#e7b54d;stroke:#a7751a}
.st.part .desk{fill:#faefd5;stroke:#a7751a}
.st text{pointer-events:none;font-family:"Barlow",system-ui,sans-serif}
.st text.num{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:9.5px;text-anchor:middle;dominant-baseline:central}
.st.free text.num{fill:#2f8a57}.st.occ text.num{fill:#ffffff}.st.part text.num{fill:#3d2a06}
.st text.nm{fill:#17212b;font-size:7.4px;font-weight:600;text-anchor:middle}
.st .lock{fill:#2a5d8c}
.st.part .lock{fill:#a7751a}
.st .note{fill:#c2571a}
.st .warn path{fill:#e8a317;stroke:#ffffff;stroke-width:.9;stroke-linejoin:round}
.st .unkdot{fill:#f3d27a;stroke:#fff;stroke-width:.8}
.st .warn text{fill:#3d2a06;font-size:10px;font-weight:800;text-anchor:middle;font-family:"Barlow",system-ui,sans-serif}
.st.aus .desk{stroke-dasharray:3 2}
.st.free.aus .desk{fill:#f4f5f6;stroke:#8d99a4}.st.free.aus .chair{fill:#f4f5f6;stroke:#8d99a4}
.st text.nm.aus{fill:#6b7785;font-style:italic;font-weight:500}
.st.loan .desk{stroke-dasharray:4 1.5}
.st.hl .desk,.st.hl .chair{stroke:#c2571a;stroke-width:2.6}
.st.sel .desk,.st.sel .chair{stroke:#c2571a;stroke-width:2.6;stroke-dasharray:4 2}
.st.dim{opacity:.3}
.st.drop-ok .desk,.st.drop-ok .chair{stroke:#23724a;stroke-width:3.2}
.st.drop-no .desk,.st.drop-no .chair{stroke:#b42318;stroke-width:3.2}
.editing .st{cursor:move}
/* plano de fondo (hoja blanca, colores fijos) */
.rz{stroke:none}.rz.priv{fill:#e9f0f7}.rz.sala{fill:#f1eff9}.rz.serv{fill:#f5f1e8}.rz.circ{fill:#eef0f2}
.thin{fill:#7f8b97}.walls{fill:#34404c}
#dwg path{fill:none;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
#dwg .dw-hatch{stroke:#c3c9cf;stroke-width:.35}
#dwg .dw-lineas,#dwg .dw-ventanas{stroke:#8d99a4;stroke-width:.6}
#dwg .dw-artef{stroke:#8d99a4;stroke-width:.6}
#dwg .dw-mob{stroke:#a9b3bc;stroke-width:.55}
#dwg .dw-vidrio{fill:#d6e8f5;stroke:#4f86b0;stroke-width:.8}
#dwg .dw-tabiques{stroke:#34404c;stroke-width:1.1}
#dwg .dw-muros{fill:#34404c;stroke:#34404c;stroke-width:.5}
#dwg .dw-puertas{stroke:#4a5763;stroke-width:.9}
.lbl.big{font-size:8.5px;letter-spacing:.1em}
.lbl.xs{font-size:4.6px;font-weight:500;text-transform:none;letter-spacing:0}
.door{fill:none;stroke:#5d6b78;pointer-events:none}.door.swing{stroke-width:.7;stroke-dasharray:2 1.5}.door.leaf{stroke-width:1.6;stroke-linecap:round}.door.dash{stroke:#c2571a}
.lbl{font-family:"Barlow",system-ui,sans-serif;fill:#5d6b78;text-anchor:middle;font-size:6.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;pointer-events:none}
.lbl.big{font-size:12px;fill:#46525e;letter-spacing:.12em}.lbl.s{font-size:6.2px;font-weight:500}
.st.adm .chair-b{stroke:#17212b;stroke-width:1.8}
.st.adm .desk{stroke-dasharray:3 1.5}
.st .adm-b{fill:#17212b}
.st .adm-i{fill:#ffffff}
.admbox{background:var(--panel2)}
.admbox .btns{margin-top:8px}
.admbox p{margin:6px 0 0}
.badge-adm{display:inline-flex;align-items:center;gap:6px;background:#17212b;color:#fff;border-radius:12px;padding:2px 10px;font-size:13px;font-weight:600;margin-top:8px}
#floorSel{font-weight:600;padding:4px 8px}
.segbox{position:absolute;left:12px;bottom:12px;max-width:min(240px,calc(100% - 80px));background:var(--panel);border:1.5px solid #b42318;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.12);font-size:12.5px;overflow:hidden}
.segbox .sh{display:flex;align-items:center;gap:6px;width:100%;border:0;border-radius:0;background:none;padding:5px 9px;color:#b42318;font-weight:600;text-align:left}
.segbox .sh:hover{background:var(--hover)}
.segbox .st{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.segbox .sn{color:var(--ink);font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segbox .car{color:var(--muted);font-size:11px}
.segbox .sb{display:grid;gap:3px;padding:2px 10px 9px;border-top:1px solid var(--line)}
.segbox .n{font-size:14px;font-weight:700;text-align:left;border:0;background:none;padding:4px 0 0;color:var(--ink);border-radius:0}
.segbox .n:hover{background:none;text-decoration:underline}
.segbox .m{color:var(--muted)}
.segbox .wk2{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;margin-top:4px;font-size:12px}
.segbox .wk2 span:nth-child(odd){font-family:var(--mono);color:var(--muted)}
.segbox .wk2 .on{color:#b42318;font-weight:700}
.segl{display:grid;gap:8px;margin:6px 0}
.segr{display:grid;grid-template-columns:1fr 90px auto;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px}
.segr select,.segr input{min-width:0}
.segd{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}
.dchip{padding:3px 9px;border-radius:14px;font-size:12.5px;border:1px solid var(--line);background:var(--panel)}
.dchip.on{background:#b42318;border-color:#b42318;color:#fff}
.segf{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 64px;gap:5px 6px;align-items:center;font-size:13px}
.segf .dl{font-family:var(--mono);color:var(--muted)}
.segf select,.segf input{padding:4px 5px;font-size:13px}
.inv dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;margin:4px 0 0;font-size:14px}
.inv dt{color:var(--muted)}.inv dd{margin:0}
.eqg{display:grid;grid-template-columns:auto auto auto;gap:6px 14px;align-items:center;margin-top:8px;font-size:14px}
.eqg .eqh{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.eqg .eqn{display:inline-flex;gap:4px;align-items:center}
.eqg .eqn input{width:46px;text-align:center}
.eqg .eqn button{padding:2px 8px}
.eqg input[type=checkbox]{width:17px;height:17px}
.invf{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 8px;align-items:center;margin-top:8px}
.invf label{font-size:13px;color:var(--muted)}
#fx .pingr{fill:none;stroke:#c2571a;stroke-width:3;vector-effect:non-scaling-stroke;animation:ping 1s ease-out 3}
@keyframes ping{from{opacity:1;transform-box:fill-box;transform-origin:center;transform:scale(.6)}to{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(2.2)}}
@media (prefers-reduced-motion:reduce){#fx .pingr{animation:none}}
.prn{cursor:pointer}
.prn .pb{stroke-width:1;rx:2}
.prn.ok .pb{fill:#e3f4ea;stroke:#2f8a57}.prn.mant .pb{fill:#faefd5;stroke:#a7751a}.prn.out .pb{fill:#fbe4e1;stroke:#b42318}
.prn .pi{fill:none;stroke:#34404c;stroke-width:.8;stroke-linejoin:round}
.prn.sele .pb{stroke:#c2571a;stroke-width:2}
.prn:focus-visible{outline:2px solid #c2571a;outline-offset:2px}
.pcard{display:grid;gap:6px}
.pcard .row1{display:flex;align-items:center;gap:8px}
.pcard .row1 b{flex:1;font-size:15px}
.stock{display:flex;align-items:center;gap:10px;margin-top:4px}
.stock .n{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.stock button{width:36px;height:36px;padding:0;font-size:18px}
.low{color:#8a5a00;font-weight:600;font-size:14px}
.bano{cursor:pointer}
.bano .bz{fill:transparent;stroke:#2f8a57;stroke-width:1;stroke-dasharray:3 2}
.bano.mant .bz{fill:rgba(231,181,77,.28);stroke:#a7751a;stroke-dasharray:none;stroke-width:1.4}
.bano.out .bz{fill:rgba(180,35,24,.16);stroke:#b42318;stroke-dasharray:none;stroke-width:1.4}
.bano .bp{fill:#e3f4ea;stroke:#2f8a57;stroke-width:.6}
.bano.mant .bp{fill:#faefd5;stroke:#a7751a}.bano.out .bp{fill:#fbe4e1;stroke:#b42318}
.bano .bt{font-family:"Barlow",system-ui,sans-serif;font-size:5.6px;font-weight:700;text-anchor:middle;fill:#1f5e3b;pointer-events:none}
.bano.mant .bt{fill:#6b4a0f}.bano.out .bt{fill:#8a1c12}

<script>
// Reemplazo local de window.claude para la app "Puestos Piso 5" de claude.ai.
// La app habla con claude.use('db' | 'user' | 'downloads' | 'assets'); aquí esas mismas llamadas
// guardan en el navegador (localStorage) y parten de los datos incrustados en el archivo (SEED).
// adaptar.py pega este archivo dentro de plantilla.html; actualizar.py rellena SEED.
const SEED = /*__SEED__*/null;
const LOCAL = (() => {
  const KEY = 'plano_puestos_gtec_v2', KEY_OLD = 'plano_puestos_gtec_v1', ME = 'local';
  const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
  let docs = null, assets = {}, saveT = null, warned = false;

  // ---------- datos del formato anterior (pisos con puestos y nombres) ----------
  // Piso 5 se pasa al plano nuevo por número de puesto; los otros pisos quedan como pisos con imagen de fondo.
  function fromLegacy(S){
    const out = {}, as = {}, now = new Date().toISOString();
    const pidOf = new Map();
    (S.people || []).forEach((p, i) => pidOf.set(p.name, 'p_' + (i + 1).toString(36).padStart(4, '0')));
    const person = p => ({name:p.name, needs:p.needs !== false, note:p.note || ''});
    const days = s => { const f = {}, d = s.days || []; for(let i = 0; i < 4; i++) f['d'+i] = pidOf.get(d[i]) || ''; f.d4 = f.d5 = pidOf.get(d[4]) || ''; return f; };
    const used = s => (s.days || []).some(Boolean);
    const layout = (typeof P5 !== 'undefined' && P5.layout.seats) || [];
    const byNum = new Map(layout.map(s => [String(s.num), s]));
    const floors = S.floors || [];
    const p5 = floors.find(f => /piso\s*5/i.test(f.name || ''));
    const extra = [];
    if(p5){
      for(const p of S.people || []) out['personas/' + pidOf.get(p.name)] = person(p);
      for(const s of p5.seats){
        const t = byNum.get(String(s.num));
        if(!t){ extra.push(s.num); continue; }
        if(used(s)) out['asig/' + t.id] = {...days(s), by:ME, at:now};
        if(s.note && s.note !== t.note) out['plano/' + t.id] = {note:s.note};
      }
    }
    for(const f of floors){
      if(f === p5) continue;
      const fid = 'f_' + String(f.id).replace(/[^A-Za-z0-9_-]/g, ''), bg = S.bgs && S.bgs[f.id];
      let bgId = '';
      if(bg){ bgId = rid(); as[bgId] = bg; }
      const sw = +f.seatW || 50, sh = +f.seatH || 34;
      out['admin-pisos/' + fid] = {name:f.name || 'Piso', bg:bgId, w:+f.w || 1000, h:+f.h || 700, scale:Math.round(Math.max(sw, sh) / 48 * 100) / 100, by:ME, at:now};
      const names = new Set();
      for(const s of f.seats){
        const [w, h] = s.rot ? [sh, sw] : [sw, sh];
        out['admin-pisos/' + fid + '/plano/' + s.id] = {num:String(s.num), x:s.x + w / 2, y:s.y + h / 2, dir:s.rot ? 'D' : 'R', note:s.note || '', area:''};
        if(used(s)){ out['pisos/' + fid + '/asig/' + s.id] = {...days(s), by:ME, at:now}; s.days.forEach(n => n && names.add(n)); }
      }
      for(const p of S.people || []) if(names.has(p.name) || !p5) out['pisos/' + fid + '/personas/' + pidOf.get(p.name)] = person(p);
    }
    if(extra.length) setTimeout(() => window.toast && toast(`Puestos de Piso 5 que no están en el plano nuevo (sin pasar): ${extra.join(', ')}`), 1500);
    return {docs:out, assets:as};
  }
  function fromAny(x){
    if(!x || typeof x !== 'object') return null;
    if(x.docs && typeof x.docs === 'object') return {docs:x.docs, assets:x.assets || {}};
    if(Array.isArray(x.floors)) return fromLegacy(x);
    return null;
  }
  function rid(){ let s = ''; for(let i = 0; i < 32; i++) s += (Math.random() * 16 | 0).toString(16); return s; }

  function init(){
    if(docs) return;
    let st = null;
    try{ const t = localStorage.getItem(KEY); if(t) st = fromAny(JSON.parse(t)); }catch(e){}
    // Primera vez: lo último que se guardó con la versión anterior en este navegador, o si no, los datos del archivo.
    if(!st){ try{ const t = localStorage.getItem(KEY_OLD); if(t) st = fromAny(JSON.parse(t)); }catch(e){} if(st) setTimeout(save, 0); }
    if(!st) st = fromAny(clone(SEED));
    st = st || {docs:{}, assets:{}};
    docs = st.docs; assets = st.assets;
  }
  function save(){
    clearTimeout(saveT); saveT = null;
    try{ localStorage.setItem(KEY, JSON.stringify({v:2, docs, assets})); }
    catch(e){ if(!warned){ warned = true; window.toast && toast('No se pudo guardar en el navegador. Usa "Guardar respaldo".'); } }
  }
  function changed(){ if(!saveT) saveT = setTimeout(save, 250); notifyAll(); }
  window.addEventListener('storage', e => { if(e.key !== KEY || !e.newValue) return; try{ const st = fromAny(JSON.parse(e.newValue)); if(st){ docs = st.docs; assets = st.assets; notifyAll(); } }catch(err){} });
  window.addEventListener('beforeunload', () => { if(saveT) save(); });

  // ---------- base de datos (misma forma que claude.use('db')) ----------
  const segs = p => String(p).split('/').filter(Boolean);
  function checkPath(p, even){
    const s = segs(p);
    if(!s.length || (s.length % 2 === 0) !== even) throw new TypeError(`Ruta inválida (${s.length} segmentos): ${p}`);
    return s.join('/');
  }
  const meta = {fromCache:false, hasPendingWrites:false};
  function dsnap(path){
    const d = docs[path], id = path.slice(path.lastIndexOf('/') + 1);
    return {id, exists:d !== undefined, data:() => clone(d), metadata:meta};
  }
  const OPS = {
    '==':(a, b) => a === b, '!=':(a, b) => a !== b, '<':(a, b) => a < b, '<=':(a, b) => a <= b, '>':(a, b) => a > b, '>=':(a, b) => a >= b,
    'in':(a, b) => Array.isArray(b) && b.includes(a), 'not-in':(a, b) => Array.isArray(b) && !b.includes(a),
    'array-contains':(a, b) => Array.isArray(a) && a.includes(b),
  };
  function run(q){
    const pre = q.path + '/';
    let list = Object.keys(docs).filter(k => k.startsWith(pre) && !k.slice(pre.length).includes('/')).sort();
    for(const [f, op, v] of q.filters) list = list.filter(k => { const x = docs[k][f]; return x !== undefined && OPS[op] && OPS[op](x, v); });
    if(q.order){
      const [f, dir] = q.order, k = dir === 'desc' ? -1 : 1;
      list.sort((a, b) => { const x = docs[a][f], y = docs[b][f]; if(x === undefined) return 1; if(y === undefined) return -1; return x < y ? -k : x > y ? k : 0; });
    }
    if(q.lim) list = list.slice(0, q.lim);
    const ds = list.map(dsnap);
    return {docs:ds, size:ds.length, empty:!ds.length, docChanges:() => ds.map((doc, i) => ({type:'added', doc, oldIndex:-1, newIndex:i})), metadata:meta};
  }
  const subs = new Set();
  let pending = false;
  function notifyAll(){
    if(pending) return; pending = true;
    setTimeout(() => { pending = false; for(const s of [...subs]) if(subs.has(s)) try{ s.fire(); }catch(e){ console.error(e); } }, 0);
  }
  function listen(fire){ const s = {fire}; subs.add(s); setTimeout(() => subs.has(s) && fire(), 0); return () => subs.delete(s); }
  function merge(a, b){
    for(const [k, v] of Object.entries(b)){
      if(v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) merge(a[k], v);
      else a[k] = clone(v);
    }
    return a;
  }
  const bad = m => Promise.reject({code:'invalid_argument', message:m});
  const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
  function docRef(path){
    path = checkPath(path, true);
    return {
      id:path.slice(path.lastIndexOf('/') + 1), path,
      get:async () => { init(); return dsnap(path); },
      set:async data => { init(); if(!isObj(data)) return bad('El documento debe ser un objeto'); docs[path] = clone(data); changed(); },
      update:async data => { init(); if(docs[path] === undefined) return bad('El documento no existe'); merge(docs[path], data); changed(); },
      delete:async () => { init(); if(docs[path] !== undefined){ delete docs[path]; changed(); } },
      acquire:async () => ({acquired:true, version:1, expiresAt:new Date(Date.now() + 5000).toISOString(), holder:ME}),
      onSnapshot:next => { init(); let last = {}; return listen(() => { const t = JSON.stringify(docs[path]); if(t === last) return; last = t; next(dsnap(path)); }); },
      collection:p => colRef(path + '/' + p),
    };
  }
  function query(q){
    return {
      where:(f, op, v) => query({...q, filters:[...q.filters, [f, op, v]]}),
      orderBy:(f, dir) => query({...q, order:[f, dir || 'asc']}),
      limit:n => query({...q, lim:n}),
      get:async () => { init(); return run(q); },
      onSnapshot:next => { init(); let last = {}; return listen(() => { const r = run(q), t = JSON.stringify(r.docs.map(d => [d.id, docs[q.path + '/' + d.id]])); if(t === last) return; last = t; next(r); }); },
    };
  }
  function colRef(path){
    path = checkPath(path, false);
    const q = query({path, filters:[], order:null, lim:0});
    return {...q, path, doc:id => docRef(path + '/' + (id || rid().slice(0, 20))), add:async data => { const r = docRef(path + '/' + rid().slice(0, 20)); await r.set(data); return r; }};
  }
  const db = {doc:docRef, collection:colRef};

  // ---------- usuario local: quien abre el archivo es el dueño ----------
  const user = {
    id:async () => ME, me:async () => ({id:ME, name:'Tú'}), isOwner:async () => true, canEdit:async () => true, can:async () => true,
    profiles:async ids => Object.fromEntries((ids || []).map(i => [i, {id:i, name:i === ME ? 'Tú' : ''}])),
    search:async () => [],
  };

  // ---------- descargas y archivos ----------
  function saveFile(filename, data){
    const blob = data instanceof Blob ? data : new Blob([data], {type:/\.json$/i.test(filename) ? 'application/json' : /\.csv$/i.test(filename) ? 'text/csv' : /\.html?$/i.test(filename) ? 'text/html' : 'application/octet-stream'});
    const a = document.createElement('a'), u = URL.createObjectURL(blob);
    a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 5000);
  }
  const downloads = {save:async ({filename, data}) => { saveFile(filename, data); }};
  const assetsApi = {
    upload:blob => new Promise((ok, fail) => {
      const r = new FileReader();
      r.onload = () => { init(); const id = rid(); assets[id] = r.result; changed(); ok({id, url:r.result, sizeBytes:blob.size, contentType:blob.type}); };
      r.onerror = () => fail({code:'unavailable', message:'No se pudo leer el archivo'});
      r.readAsDataURL(blob);
    }),
    list:async () => { init(); return {assets:Object.keys(assets).map(id => ({id, url:assets[id]})), usage:{}}; },
    delete:async id => { init(); if(assets[id]){ delete assets[id]; changed(); } },
  };

  // ---------- respaldo ----------
  function backup(){
    init(); save();
    saveFile(`Respaldo plano puestos ${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({v:2, docs, assets}));
  }
  function restoreFile(){
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = () => {
      const f = inp.files[0]; if(!f) return;
      f.text().then(t => {
        const st = fromAny(JSON.parse(t));
        if(!st) return toast('Ese archivo no es un respaldo del plano de puestos.');
        if(!confirm('¿Reemplazar los datos de este navegador por los del respaldo? Conviene guardar un respaldo antes.')) return;
        docs = st.docs; assets = st.assets; save(); location.reload();
      }).catch(() => toast('No se pudo leer el respaldo.'));
    };
    inp.click();
  }
  function reset(){
    if(!confirm('¿Volver a los datos guardados en el archivo? Se pierden los cambios hechos en este navegador que no estén en un respaldo.')) return;
    const st = fromAny(clone(SEED)) || {docs:{}, assets:{}};
    docs = st.docs; assets = st.assets; save(); location.reload();
  }

  const caps = {db, user, downloads, assets:assetsApi};
  window.claude = {use:async name => caps[name] || null};
  return {backup, restoreFile, reset, blob:id => { init(); return assets[id] || (id ? '/_blob/' + id : ''); }};
})();
</script>

function dateOfDay(d){
  const mon = weekStart();
  if(d < VA) return addDays(mon, d);
  const fri = addDays(mon, 4), g = groupOf(new Date(fri + 'T12:00:00'));
  return (d === VA ? 'A' : 'B') === g ? fri : null;
}
function absentOn(pid, date){
  if(!date) return null;
  for(const a of ausencias.values()) if(a.pid === pid && ISO.test(a.desde) && ISO.test(a.hasta) && a.desde <= date && date <= a.hasta) return a;
  return null;
}
function absencesOf(pid){ return [...ausencias].filter(([, a]) => a.pid === pid && ISO.test(a.desde) && ISO.test(a.hasta)).sort((x, y) => x[1].desde.localeCompare(y[1].desde)); }
// Quién usa realmente el puesto ese día: el titular, un préstamo (si el titular está ausente o el puesto está libre) o nadie por ausencia.
function effOf(sid, d){
  const base = dayOf(sid, d), date = dateOfDay(d);
  if(!date) return {pid:base, kind:base ? 'fijo' : ''};
  const ab = base && absentOn(base, date);
  const loan = prestamos.get(date + '_' + sid);
  if(loan && people.has(loan.pid) && (!base || ab)) return {pid:loan.pid, kind:'prestamo', owner:base, ab};
  if(ab) return {pid:'', kind:'ausente', owner:base, ab};
  return {pid:base, kind:base ? 'fijo' : ''};
}
const fmtD = s => new Date(s + 'T12:00:00').toLocaleDateString('es-CL', {day:'numeric', month:'short'});
const fmtRange = (a, b) => a === b ? fmtD(a) : `${fmtD(a)}–${fmtD(b)}`;
function thisFridayDay(){ return groupOf(new Date()) === 'A' ? VA : VB; }

function bump(){ ver++; seatsMemo = null; idxMemo = null; }
const isDir = d => Object.prototype.hasOwnProperty.call(VEC, d);
const num = (v, def) => Number.isFinite(+v) ? +v : def;
function cleanSeat(s){ return {...s, x:num(s.x, 0), y:num(s.y, 0), dir:isDir(s.dir) ? s.dir : 'R', num:String(s.num ?? ''), note:String(s.note ?? ''), area:String(s.area ?? '')}; }
function seats(){
  if(seatsMemo) return seatsMemo;
  const out = [];
  for(const s of LAYOUT.seats){
    const o = plano.get(s.id);
    if(o && o.deleted) continue;
    out.push(cleanSeat({...s, ...(o || {}), id:s.id}));
  }
  for(const [id, o] of plano) if(!o.deleted && !LAYOUT_IDS.has(id)) out.push(cleanSeat({...o, id}));
  out.sort((a,b) => (parseInt(a.num)||0) - (parseInt(b.num)||0) || a.num.localeCompare(b.num));
  seatsMemo = out; seatsMemo.byId = new Map(out.map(s => [s.id, s]));
  return out;
}
function seatById(id){ return seats().byId.get(id); }
function isAdm(sid){ const f = fijos.get(sid); return !!(f && f.locked); }
function srcOf(sid){ return withVB(isAdm(sid) ? fijos.get(sid) : asig.get(sid)); }
function dayOf(sid, d){ const a = srcOf(sid); const p = a && a['d'+d]; return p && people.has(p) ? p : ''; }
function pname(pid){ const p = people.get(pid); return p ? p.name : ''; }

const DISCS = ['Civil', 'Mecánica', 'Arquitectura', 'Levantamiento digital', 'PyC', 'Control y gestión', 'Control documental', 'Gerente', 'Electricidad'];
const discOf = p => DISCS.includes(p.disc) ? p.disc : '';
// Días que la persona viene a la oficina. Sin dato = toda la semana; [] = no viene (remoto).
function pdias(p){ return p && Array.isArray(p.dias) ? [...new Set(p.dias.filter(d => Number.isInteger(d) && d >= 0 && d < ALL.length))].sort((a, b) => a - b) : ALL; }
function diasLabel(ds){ return ds.length === ALL.length ? 'Toda la semana' : ds.length ? dayWords(ds, DAYS).join(' ') : 'No viene (remoto)'; }

function workDays(pid){ const ds = pdias(people.get(pid)); return scopeDays().filter(d => ds.includes(d)); }

function personIndex(){

  for(const s of seats()) for(const d of ALL){ const p = dayOf(s.id, d); if(p){ if(!idx.has(p)) idx.set(p, []); idx.get(p).push({s, d}); } }
  return idxMemo = idx;
}
function seatState(s){
  const e = scopeDays().map(d => effOf(s.id, d));
  const ids = e.map(x => x.pid).filter(Boolean), aus = e.filter(x => x.kind === 'ausente'), loan = e.some(x => x.kind === 'prestamo');
  const extra = {aus:aus.length > 0, owners:[...new Set(aus.map(x => x.owner))], loan};
  if(!ids.length) return {cls:'free', ids:[], ...extra};
  const uniq = [...new Set(ids)];
  if(ui.day !== WEEK) return {cls:'occ', ids:uniq, ...extra};
  return {cls: ids.length === ALL.length && uniq.length === 1 && !extra.aus ? 'occ' : 'part', ids:uniq, ...extra};
}
function summary(list){
  const bySeat = new Map();
  for(const {s, d} of list){ if(!bySeat.has(s.num)) bySeat.set(s.num, []); bySeat.get(s.num).push(d); }
  return [...bySeat].map(([n, ds]) => `P${n} ${ds.length === ALL.length ? 'Lu–Vi' : dayWords(ds, DAYS).join(' ')}`).join(', ');
}

// ---------- escrituras ----------
const chains = new Map();
function serial(path, fn){
  const p = (chains.get(path) || Promise.resolve()).catch(() => {}).then(fn);
  chains.set(path, p);
  return p;
}
function writeErr(e){
  const code = e && e.code;
  if(code === 'not_granted' || (code === 'invalid_argument' && ui.canWriteKnown !== true)){ ui.canWrite = false; render(); toast('No tienes permiso para hacer cambios. Pide al dueño acceso de Colaborador.'); }
  else if(code === 'invalid_argument') toast('No se pudo guardar este cambio. Recarga la página e inténtalo de nuevo.');
  else if(code === 'quota_exceeded') toast('Se llenó el espacio de datos. Borra personas o puestos que no uses.');
  else toast('No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.');
}
const EMPTY_DAYS = {d0:'', d1:'', d2:'', d3:'', d4:'', d5:''};
// Datos anteriores al turno de viernes solo tienen d4 (todos los viernes): se leen como d4 = d5.
function withVB(a){ return a && a.d5 === undefined && a.d4 !== undefined ? {...a, d5:a.d4} : a; }
// Cambia un puesto con un bloqueo corto: nadie más escribe ese puesto mientras se revisa y guarda.
// mutate(cur) devuelve los campos d0..d4 a escribir, o un texto con el motivo si no se puede.
async function getLease(ref){
  let lease = null;
  for(let i = 0; i < 3; i++){
    try{ lease = await ref.acquire({holder: meId || TAB, ttlMs: 5000}); }
    catch(e){ if(e && (e.code === 'capability_removed' || e.code === 'capability_disabled')) return true; throw e; }
    if(lease.acquired) return true;
    await new Promise(r => setTimeout(r, 400 + Math.random() * 400));
  }
  return false;
}
function lockedWrite(sid, mutate){
  const adm = isAdm(sid);
  if(adm && !ui.isAdmin) return Promise.resolve('Este puesto está fijado por administración. Solo un administrador puede cambiarlo.');
  const ref = dref(adm ? 'fijos' : 'asig', sid);
  return serial(ref.path, async () => {
    if(!await getLease(ref)) return 'Otra persona está cambiando este puesto en este momento. Inténtalo en unos segundos.';
    const snap = await ref.get();
    const cur = {...EMPTY_DAYS, ...(snap.exists ? withVB(snap.data()) : {})};
    const res = mutate(cur);
    if(typeof res === 'string') return res;
    if(!res) return null;
    const next = {};
    for(const d of ALL) next['d'+d] = res['d'+d] ?? cur['d'+d] ?? '';
    await ref.set({...next, ...(adm ? {locked:true} : {}), by: meId, at: new Date().toISOString()});
    return null;
  });
}
// fijar / soltar un puesto (solo administración)
async function setAdmLock(sid, on){
  if(on){
    const f = {}; for(const d of ALL) f['d'+d] = dayOf(sid, d);
    const ref = dref('fijos', sid);
    await serial(ref.path, () => ref.set({...f, locked:true, by: meId, at: new Date().toISOString()}));
  } else {
    const f = {}; for(const d of ALL) f['d'+d] = dayOf(sid, d);
    const a = dref('asig', sid), fx = dref('fijos', sid);
    await serial(a.path, () => a.set({...f, by: meId, at: new Date().toISOString()}));
    await serial(fx.path, () => fx.delete());
  }
}
async function pool(items, n, fn){
  let i = 0, done = 0, fail = 0;
  const run = async () => { while(i < items.length){ const it = items[i++]; try{ await fn(it); done++; }catch(e){ fail++; } setProgress(done + fail, items.length); } };
  await Promise.all(Array.from({length: Math.min(n, items.length)}, run));
  setProgress(null);
  return {done, fail};
}
function setProgress(k, n){ const el = $('#admProg'); if(el) el.textContent = k == null ? '' : `Procesando ${k} de ${n}…`; }
// ---------- salas ----------
const HHMM = /^([01]\d|2[0-3]):[0-5]\d$/;
const validBooking = b => b && typeof b === 'object' && HHMM.test(b.start) && HHMM.test(b.end) && b.start < b.end && typeof b.id === 'string';
function roomDay(rid, date){ const d = salas.get(rid + '_' + date); return (d && Array.isArray(d.items)) ? d.items.filter(validBooking) : []; }
function roomWrite(rid, date, mutate){
  const ref = dref('salas', rid + '_' + date);
  return serial(ref.path, async () => {
    if(!await getLease(ref)) return 'Otra persona está reservando esta sala en este momento. Inténtalo en unos segundos.';
    const snap = await ref.get();
    const items = snap.exists && Array.isArray(snap.data().items) ? snap.data().items.filter(validBooking) : [];
    const res = mutate(items);
    if(typeof res === 'string') return res;
    await ref.set({room: rid, date, items: res.sort((a, b) => a.start.localeCompare(b.start))});
    return null;
  });
}
const profName = new Map(); // id → nombre, solo en memoria (nunca se guarda en la base)
function wantNames(ids){
  const miss = [...new Set(ids.filter(i => i && !profName.has(i)))];
  if(!miss.length || !user) return;
  miss.forEach(i => profName.set(i, ''));
  user.profiles(miss).then(ps => { let any = false; for(const i of miss){ const n = ps[i] && ps[i].name; if(n){ profName.set(i, n); any = true; } } if(any) scheduleRender(); });
}
function bookWho(b){
  if(b.pid && people.has(b.pid)) return pname(b.pid);
  if(b.by === meId && meId) return 'Yo';
  return profName.get(b.by) || b.byName || 'Alguien';
}
async function book(rid, date, start, end, pid, title){
  if(!db || readOnly()) return;
  const room = ROOMS.find(r => r.id === rid);
  try{
    const why = await roomWrite(rid, date, items => {
      const c = items.find(b => b.start < end && start < b.end);
      if(c) return `La ${room.name} ya está reservada de ${c.start} a ${c.end} por ${bookWho(c)}.`;
      return [...items, {id: uid('r'), start, end, pid: pid || '', title: title || '', by: meId, at: new Date().toISOString()}];
    });
    if(why) return toast(why);
    ui.rsel = null; ui.rend = null; render();
    toast(`${room.name} reservada ${fmtDate(date)} de ${start} a ${end}`);
  }catch(e){ writeErr(e); }
}
async function unbook(rid, date, id){
  try{
    const why = await roomWrite(rid, date, items => items.filter(b => b.id !== id));
    if(why) return toast(why);
    ui.confirm = null; toast('Reserva cancelada');
  }catch(e){ writeErr(e); }
}

function roomNow(r){
  const today = todayStr(), now = new Date(), m = now.getHours() * 60 + now.getMinutes(), t = hm(m);
  const items = roomDay(r.id, today);
  const cur = items.find(b => b.start <= t && t < b.end);
  if(cur) return {busy:true, text:'Ocupada hasta ' + cur.end};
  const next = items.find(b => b.start > t);
  return {busy:false, text: next ? 'Libre · próxima ' + next.start : 'Libre hoy'};
}

const isTaken = (cur, d, pid) => { const c = cur['d'+d]; return c && c !== pid && people.has(c); };

// Asigna y bloquea el puesto sid para pid en los días dados. Si la persona ya tenía otro puesto esos días, lo libera.
function refuseAdm(s){
  toast(`El puesto ${s.num} está fijado por administración. Solo un administrador puede cambiarlo.`);
  const g = document.querySelector(`[data-seat="${CSS.escape(s.id)}"]`);
  if(g){ g.classList.add('drop-no'); setTimeout(() => g.classList.remove('drop-no'), 900); }
}
async function claim(sid, pid, days){
  if(!db || readOnly()) return;
  const s = seatById(sid); if(!s) return;
  if(isAdm(sid) && !ui.isAdmin) return refuseAdm(s);
  if(!ui.isAdmin){
    const fixed = seats().find(o => o.id !== sid && isAdm(o.id) && days.some(d => dayOf(o.id, d) === pid));
    if(fixed) return toast(`${shortName(pname(pid))} tiene el puesto ${fixed.num} fijado por administración. Solo un administrador puede moverlo.`);
  }
  const pre = days.filter(d => dayOf(sid, d) && dayOf(sid, d) !== pid);
  if(pre.length){ refuse(s, pre); return; }
  let blocked = null;
  try{
    const why = await lockedWrite(sid, cur => {
      const t = days.filter(d => isTaken(cur, d, pid));
      if(t.length){ blocked = t.map(d => ({d, p:cur['d'+d]})); return 'taken'; }
      const f = {}; for(const d of days) f['d'+d] = pid; return f;
    });
    if(why === 'taken'){ refuse(s, blocked.map(b => b.d), blocked[0].p); return; }
    if(why){ toast(why); return; }
  }catch(e){ writeErr(e); return; }
  // liberar sus otros puestos en esos días
  const moved = [];
  for(const o of seats()){
    if(o.id === sid) continue;
    const ds = days.filter(d => dayOf(o.id, d) === pid);
    if(!ds.length) continue;
    moved.push(o.num);
    lockedWrite(o.id, cur => { const f = {}; for(const d of ds) if(cur['d'+d] === pid) f['d'+d] = ''; return f; }).catch(writeErr);
  }
  toast(`${shortName(pname(pid))} quedó en el puesto ${s.num} ${whenLabel(days)} 🔒` + (moved.length ? ` · liberó el P${moved.join(', P')}` : ''));
}
// Asigna usando los días que la persona viene. Si se eligió un solo día, se respeta aunque no sea día habitual.
function claimWork(sid, pid, fixedDays){
  if(fixedDays) return claim(sid, pid, fixedDays);
  if(ui.day !== WEEK){
    const e = effOf(sid, ui.day);
    if(e.kind === 'ausente') return lend(sid, pid, ui.day);
    if(e.kind === 'prestamo' && e.pid !== pid) return toast(`Ese día el puesto ya está prestado a ${shortName(pname(e.pid))}.`);
  }
  let days = workDays(pid);
  if(!days.length){
    if(ui.day !== WEEK) days = [ui.day];
    else return toast(`${shortName(pname(pid))} no tiene días de oficina marcados. Edita su ficha o elige un día arriba.`);
  }
  return claim(sid, pid, days);
}
// Préstamo por un día: el titular está ausente y otra persona usa el puesto solo esa fecha.
async function lend(sid, pid, d){
  if(!db || readOnly()) return;
  const s = seatById(sid), date = dateOfDay(d), e = effOf(sid, d);
  if(!date) return toast('Ese viernes no le toca a este grupo. Elige el viernes de esta semana.');
  if(isAdm(sid) && !ui.isAdmin) return refuseAdm(s);
  const ref = dref('prestamos', date + '_' + sid);
  try{
    const why = await serial(ref.path, async () => {
      if(!await getLease(ref)) return 'Otra persona está usando este puesto en este momento. Inténtalo en unos segundos.';
      const snap = await ref.get(), cur = snap.exists ? snap.data() : null;
      if(cur && cur.pid && cur.pid !== pid && people.has(cur.pid)) return `Ese día el puesto ya está prestado a ${shortName(pname(cur.pid))}.`;
      await ref.set({pid, sid, date, owner: e.owner || '', by: meId, at: new Date().toISOString()});
      return null;
    });
    if(why) return toast(why);
    toast(`${shortName(pname(pid))} usará el puesto ${s.num} el ${fmtD(date)}${e.owner ? ` (${shortName(pname(e.owner))} está ausente)` : ''}`);
  }catch(err){ writeErr(err); }
}
async function unlend(sid, d){
  const date = dateOfDay(d); if(!date) return;
  const ref = dref('prestamos', date + '_' + sid);
  serial(ref.path, () => ref.delete()).then(() => toast('Préstamo quitado')).catch(writeErr);
}
function refuse(s, ds, who){

  const g = document.querySelector(`[data-seat="${CSS.escape(s.id)}"]`);
  if(g){ g.classList.add('drop-no'); setTimeout(() => g.classList.remove('drop-no'), 900); }
}
async function release(sid, days){
  if(!db || readOnly()) return;
  if(isAdm(sid) && !ui.isAdmin){ const s = seatById(sid); return s && refuseAdm(s); }
  try{
    const why = await lockedWrite(sid, () => { const f = {}; for(const d of days) f['d'+d] = ''; return f; });
    if(why) return toast(why);
    const s = seatById(sid); toast(`Puesto ${s ? s.num : ''} liberado ${whenLabel(days)}`);
  }catch(e){ writeErr(e); }
}

// ---------- vista ----------
let vb = {x:0, y:0, w:1000, h:800}, fitted = false;
function seatBox(s){
  const [vx, vy] = VEC[s.dir || 'R'], h = G.chair/2, far = h + G.deskD;
  const xs = [s.x - h, s.x + h, s.x + vx*far + (vy ? G.deskW/2 : 0), s.x + vx*far - (vy ? G.deskW/2 : 0)];
  const ys = [s.y - h, s.y + h, s.y + vy*far + (vx ? G.deskW/2 : 0), s.y + vy*far - (vx ? G.deskW/2 : 0)];
  return {x0:Math.min(...xs), y0:Math.min(...ys), x1:Math.max(...xs), y1:Math.max(...ys)};
}
function bounds(){
  let x0 = 0, y0 = 0, x1 = LAYOUT.w, y1 = LAYOUT.h;
  for(const s of seats()){ const b = seatBox(s); x0 = Math.min(x0, b.x0); y0 = Math.min(y0, b.y0); x1 = Math.max(x1, b.x1); y1 = Math.max(y1, b.y1); }
  const p = 16; return {x:x0 - p, y:y0 - p, w:x1 - x0 + 2*p, h:y1 - y0 + 2*p};
}
function applyVB(){ svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function fit(){
  const b = bounds(), r = svg.getBoundingClientRect();
  if(!r.width || !r.height) return;
  const k = Math.max(b.w / r.width, b.h / r.height) * 1.02;
  vb = {w:r.width * k, h:r.height * k}; vb.x = b.x - (vb.w - b.w) / 2; vb.y = b.y - (vb.h - b.h) / 2;
  applyVB(); fitted = true; lastW = r.width;
}
function toWorld(cx, cy){ const r = svg.getBoundingClientRect(); return {x: vb.x + (cx - r.left) / r.width * vb.w, y: vb.y + (cy - r.top) / r.height * vb.h}; }
function zoomAt(cx, cy, f){
  const r = svg.getBoundingClientRect(), w = toWorld(cx, cy);
  const nw = Math.min(Math.max(vb.w * f, 60), 5000); f = nw / vb.w;
  vb.w *= f; vb.h *= f; vb.x = w.x - (cx - r.left) / r.width * vb.w; vb.y = w.y - (cy - r.top) / r.height * vb.h; applyVB();
}
function zoomCenter(f){ const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width/2, r.top + r.height/2, f); }
// Al cambiar el tamaño del plano (abrir o cerrar un panel) se mantiene la escala y el centro: solo cambia cuánto se ve.
let lastW = 0;
new ResizeObserver(() => {
  const r = svg.getBoundingClientRect(); if(!r.width) return;
  if(!fitted){ fit(); lastW = r.width; return; }
  const k = vb.w / (lastW || r.width), cx = vb.x + vb.w/2, cy = vb.y + vb.h/2;
  vb.w = r.width * k; vb.h = r.height * k; vb.x = cx - vb.w/2; vb.y = cy - vb.h/2; applyVB(); lastW = r.width;
}).observe(svg);

function seatSVG(s, hl){
  const st = seatState(s), dir = s.dir || 'R', [vx, vy] = VEC[dir], h = G.chair/2;
  const dim = ui.q && !ui.pick && hl.size && !hl.has(s.id);
  const cls = ['st', st.cls, st.aus ? 'aus' : '', st.loan ? 'loan' : '', isAdm(s.id) ? 'adm' : '', hl.has(s.id) ? 'hl' : '', ui.sel === s.id ? 'sel' : '', dim ? 'dim' : ''].join(' ');
  let o = `<g data-seat="${esc(s.id)}" class="${cls}" tabindex="0" role="button" aria-label="Puesto ${esc(s.num)}${st.ids.length ? ', ' + esc(st.ids.map(pname).join(', ')) : ', libre'}">`;
  o += `<g transform="translate(${s.x},${s.y}) rotate(${ANG[dir]})">`;
  o += `<rect class="desk" x="${h}" y="${-G.deskW/2}" width="${G.deskD}" height="${G.deskW}" rx="1.5"/>`;
  o += `<rect class="chair-b" x="${-h}" y="${-h}" width="${G.chair}" height="${G.chair}" rx="2"/>`;
  o += `<circle class="chair" r="${G.r}"/>`;
  o += `</g>`;
  o += `<text class="num" x="${s.x}" y="${s.y}">${esc(s.num)}</text>`;
  const dcx = s.x + vx * (h + G.deskD/2), dcy = s.y + vy * (h + G.deskD/2);
  const wide = vy !== 0, maxc = wide ? 12 : 8;
  let lines = [];
  const names = st.ids.map(pname);
  let nmc = 'nm';
  if(!names.length && st.aus && st.owners.length){ lines = ['Ausente', shortName(pname(st.owners[0])).split(' ')[0]]; nmc = 'nm aus'; }
  else if(names.length === 1){ const t = shortName(names[0]).split(' '); lines = t.length > 1 ? [t[0], t.slice(1).join(' ')] : t; }
  else if(names.length > 1) lines = names.length === 2 ? names.map(n => n.split(' ')[0]) : [names.length + ' pers.'];
  lines.forEach((l, i) => {
    if(l.length > maxc) l = l.slice(0, maxc - 1) + '…';
    const y = dcy + (i - (lines.length - 1)/2) * 8.6 + 2.6;
    o += `<text class="${nmc}" x="${dcx}" y="${y}">${esc(l)}</text>`;
  });
  if(st.cls !== 'free'){
    const lx = s.x + vx * (h + G.deskD - 5) + (vx ? 0 : G.deskW/2 - 9), ly = s.y + vy * (h + G.deskD - 5) + (vy ? 0 : G.deskW/2 - 9);
    o += `<use href="#lk" class="lock" x="${lx - 3.5}" y="${ly - 4.2}" width="7" height="8.4"/>`;
  }
  if(isAdm(s.id)){
    const bx = s.x - h + 3.5, by = s.y + h - 3.5;
    o += `<circle class="adm-b" cx="${bx}" cy="${by}" r="5"/><use href="#lk" class="adm-i" x="${bx - 2.6}" y="${by - 3.2}" width="5.2" height="6.4"/>`;
  }
  const miss = ui.warnOff ? [] : eqMissing(s.id);
  if(miss.length){
    const ax = s.x - h + 2, ay = s.y - h;
    o += miss[0] === 'sin registrar'
      ? `<circle class="unkdot" cx="${s.x - h + 3}" cy="${s.y - h + 3}" r="2.6"><title>Sin inventario registrado</title></circle>`
      : `<g class="warn"><path d="M${ax} ${ay - 10}l8.5 14.7h-17z"/><text x="${ax}" y="${ay + 3.2}">!</text></g>`;
  }
  if(s.note) o += `<circle class="note" cx="${s.x + h - 3}" cy="${s.y - h + 3}" r="2.6"/>`;
  return o + '</g>';
}

function shiftPlan(s, nn){
  if(!/^\d+$/.test(nn)) return 'Para correr los siguientes, el número nuevo debe ser solo dígitos.';

  const all = seats(), next = all.filter(x => x.id !== s.id && /^\d+$/.test(x.num) && +x.num > old);

  const moved = new Set([s.id, ...next.map(x => x.id)]), taken = new Map(all.filter(x => !moved.has(x.id)).map(x => [x.num, x]));
  const clash = [nn, ...plan.map(([, n]) => n)].find(n => taken.has(n));

  return plan;
}

  const plan = shiftPlan(s, nn);

// Al cambiar los días de una persona, su puesto se ajusta: libera los días que ya no viene
// y, si tiene un solo puesto, lo extiende a los días nuevos (si están libres).
function syncDias(pid, oldD, newD){
  if(readOnly()) return '';
  const idx = personIndex(), mine = idx.get(pid) || [], out = [];
  const drop = new Map();
  for(const {s, d} of mine) if(!newD.includes(d)){ if(!drop.has(s.id)) drop.set(s.id, []); drop.get(s.id).push(d); }
  let skipped = 0;
  for(const [sid, ds] of drop){
    if(isAdm(sid) && !ui.isAdmin){ skipped++; continue; }
    lockedWrite(sid, cur => { const f = {}; for(const d of ds) if(cur['d'+d] === pid) f['d'+d] = ''; return f; }).catch(writeErr);
    out.push(`liberó P${seatById(sid).num} ${ds.map(d => DAYS[d]).join(' ')}`);
  }
  const seatsOf = [...new Set(mine.map(x => x.s.id))];
  const add = newD.filter(d => !oldD.includes(d) && !mine.some(x => x.d === d));
  if(add.length && seatsOf.length === 1){
    const sid = seatsOf[0];
    claim(sid, pid, add);
  }
  if(skipped) out.push(`${skipped} puesto fijado no se cambió`);
  return out.join(' · ');
}

      return;
    }
    const dup = seats().find(x => x.id !== s.id && x.num === nn);
    if(dup && nn !== s.num) return toast(`Ya existe un puesto ${nn}. Marca "Correr también los números siguientes" o elige otro número.`);

const ptrs = new Map(); let gesture = null;
svg.addEventListener('pointerdown', e => {
  svg.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; gesture = {type:'pinch', d:Math.hypot(a.x - b.x, a.y - b.y)}; pdrag = null; ghost.hidden = true; return; }
  const g = e.target.closest('[data-seat]'), sid = g && g.dataset.seat;
  const rg = !sid && e.target.closest('[data-room]'), rid = rg && rg.dataset.room;
  const eg = !sid && e.target.closest('[data-elev]'), eid = eg && eg.dataset.elev;
  const pg = !sid && e.target.closest('[data-print]'), prid = pg && pg.dataset.print;
  if(sid && ui.mode === 'ordenar' && ui.isAdmin && !fixedPlan()){
    const s = seatById(sid), w = toWorld(e.clientX, e.clientY);
    gesture = {type:'seat', sid, x0:e.clientX, y0:e.clientY, dx:w.x - s.x, dy:w.y - s.y, moved:false, s:{...s}};
    return;
  }
  gesture = {type:'pan', sid, rid, eid, prid, x0:e.clientX, y0:e.clientY, vx:vb.x, vy:vb.y, moved:false};
  if(sid && ui.mode === 'asignar' && !readOnly()){
    // arrastrar un puesto ocupado mueve a su persona (en los días que ocupa dentro de la vista actual)
    const ids = [...new Set(scopeDays().map(d => dayOf(sid, d)).filter(Boolean))];
    if(ids.length === 1 && (!isAdm(sid) || ui.isAdmin)){
      const days = scopeDays().filter(d => dayOf(sid, d) === ids[0]);
      gesture.type = 'person'; startDrag(ids[0], sid, e); pdrag.days = days;
    }
  }
});
svg.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId) || !gesture) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(gesture.type === 'pinch' && ptrs.size === 2){
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((a.x + b.x)/2, (a.y + b.y)/2, gesture.d / d); gesture.d = d; return;
  }
  if(gesture.type === 'person') return; // lo maneja moveDrag
  if(Math.hypot(e.clientX - gesture.x0, e.clientY - gesture.y0) > 4) gesture.moved = true;
  if(!gesture.moved) return;
  if(gesture.type === 'pan'){
    svg.classList.add('panning');
    const r = svg.getBoundingClientRect();
    vb.x = gesture.vx - (e.clientX - gesture.x0) / r.width * vb.w; vb.y = gesture.vy - (e.clientY - gesture.y0) / r.height * vb.h; applyVB();
  } else if(gesture.type === 'seat'){
    const w = toWorld(e.clientX, e.clientY), q = 2;
    gesture.s.x = Math.round((w.x - gesture.dx) / q) * q; gesture.s.y = Math.round((w.y - gesture.dy) / q) * q;
    moveSeatEl(gesture.sid, gesture.s);
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId); svg.classList.remove('panning');
  const g = gesture;
  if(ptrs.size){ gesture = null; return; }
  gesture = null;
  if(!g || g.type === 'pinch') return;
  if(g.type === 'person'){
    const wasActive = pdrag && pdrag.active;
    if(!wasActive){ pdrag = null; if(e.type === 'pointerup') onSeatTap(g.sid); }
    return; // soltar lo resuelve window pointerup → endDrag
  }
  if(g.type === 'seat' && g.moved){ plano.set(g.sid, {...(plano.get(g.sid) || {}), ...g.s}); bump(); savePlano(g.s); ui.sel = g.sid; render(); return; }
  if(!g.moved && e.type === 'pointerup'){
    if(g.sid) onSeatTap(g.sid);
    else if(g.rid) onRoomTap(g.rid);
    else if(g.eid) onElevTap(g.eid);
    else if(g.prid) openPrint(g.prid);
    else if(ui.sel || ui.room || ui.elev){ ui.sel = null; ui.room = null; ui.elev = null; ui.confirm = null; render(); }
  }
}

function slotRange(t){
  // desde t hasta 1 h después, sin chocar con la siguiente reserva
  const items = roomDay(ui.room, ui.rdate);
  let end = Math.min(mins(t) + 60, SLOT1);
  const next = items.find(b => b.start > t);
  if(next) end = Math.min(end, mins(next.start));
  return hm(end);
}
$('#roomPane').onclick = e => {
  const t = e.target.closest('button'); if(!t) return;
  if(t.id === 'roomX'){ ui.room = null; ui.confirm = null; render(); return; }
  if(t.id === 'dPrev' || t.id === 'dNext'){
    const d = new Date(ui.rdate + 'T12:00:00'); d.setDate(d.getDate() + (t.id === 'dNext' ? 1 : -1));
    const s = todayStr(d); if(s < todayStr()) return;
    ui.rdate = s; ui.rsel = null; ui.rend = null; ui.confirm = null; renderRoomPane(); return;
  }
  if(t.dataset.slot){
    const s = t.dataset.slot;
    if(ui.rsel && s >= ui.rsel && !ui.pickedEnd){
      // segundo toque: fija el término al final del bloque tocado, si no hay reservas entre medio
      const endT = hm(mins(s) + STEP);
      const clash = roomDay(ui.room, ui.rdate).find(b => b.start < endT && ui.rsel < b.end);
      if(!clash){ ui.rend = endT; ui.pickedEnd = true; renderRoomPane(); return; }
    }
    ui.rsel = s; ui.rend = slotRange(s); ui.pickedEnd = false; renderRoomPane(); return;
  }
  if(t.id === 'rBook'){
    const s = $('#rs').value, en = $('#re').value;
    if(!s || !en) return toast('Elige la hora de inicio y de término.');
    if(en <= s) return toast('La hora de término debe ser posterior a la de inicio.');
    if(ui.rdate === todayStr() && mins(en) <= new Date().getHours() * 60 + new Date().getMinutes()) return toast('Ese horario ya pasó.');
    book(ui.room, ui.rdate, s, en, $('#rp').value, $('#rt').value.trim()); return;
  }
  if(t.dataset.un){ ui.confirm = 'b:' + t.dataset.un; renderRoomPane(); return; }
  if(t.hasAttribute('data-unno')){ ui.confirm = null; renderRoomPane(); return; }
  if(t.dataset.unok){ unbook(ui.room, ui.rdate, t.dataset.unok); return; }

// Cada semana se guarda una copia de cómo quedó el plano (quién tenía cada puesto y qué días),
// así los reportes de semanas pasadas no cambian aunque después se reorganice la oficina.
let snapT = 0, snapLast = '';
function weekSnapBody(){
  const s = {}, n = {};
  for(const x of seats()){
    s[x.id] = [x.num, x.area || '', ...ALL.map(d => dayOf(x.id, d))];
    for(const d of ALL){ const p = dayOf(x.id, d); if(p && !n[p]){ const q = people.get(p); n[p] = [q.name, discOf(q)]; } }
  }
  return {s, n};
}
function weekSnapTick(){
  if(!db || readOnly() || !people.size || !seats().length) return;
  if(snapT) return;
  snapT = setTimeout(async () => {
    snapT = 0;
    if(!db || readOnly() || !people.size || !seats().length) return;
    const mon = todayStr(mondayOf(new Date())), body = weekSnapBody(), key = FID + mon + JSON.stringify(body);
    if(key === snapLast) return;
    const ref = dref('semanas', mon);
    try{
      const cur = await ref.get();
      if(!(cur.exists && JSON.stringify({s:cur.data().s, n:cur.data().n}) === JSON.stringify(body)))
        await serial(ref.path, () => ref.set({mon, ...body, at:new Date().toISOString(), by:meId}));
      snapLast = key;
    }catch(e){}
  }, 8000);
}

const XE = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '');
function colName(i){ let s = ''; i++; while(i){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; } return s; }
// Libro .xlsx mínimo (sin librerías): cada hoja es {name, widths, rows}; una celda es texto, número, {v, s} o {d:'aaaa-mm-dd'}.
// Estilos: 1 encabezado, 2 fecha, 3 ausente (rojo), 4 préstamo (amarillo), 5 libre (gris), 6 título.
function xlsxBlob(sheets){
  const sheetXml = sh => {
    const rows = sh.rows.map((r, ri) => `<row r="${ri + 1}">` + r.map((c, ci) => {

      const st = o.d ? 2 : (o.s || (ri === (sh.head ?? 0) && sh.head !== -1 ? 1 : 0));
      if(o.d){ const t = (new Date(o.d + 'T00:00:00Z') - Date.UTC(1899, 11, 30)) / 864e5; return `<c r="${ref}" s="${o.s || 2}"><v>${t}</v></c>`; }
      if(typeof o.v === 'number') return `<c r="${ref}" s="${st}"><v>${o.v}</v></c>`;
      return `<c r="${ref}" s="${st}" t="inlineStr"><is><t xml:space="preserve">${XE(o.v)}</t></is></c>`;
    }).join('') + '</row>').join('');
    const h = sh.head ?? 0, last = colName(Math.max(...sh.rows.map(r => r.length), 1) - 1) + sh.rows.length;
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
      + (h >= 0 ? `<sheetViews><sheetView workbookViewId="0"><pane ySplit="${h + 1}" topLeftCell="A${h + 2}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>` : '')
      + `<cols>${(sh.widths || []).map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>`
      + `<sheetData>${rows}</sheetData>` + (h >= 0 && sh.rows.length > h + 1 ? `<autoFilter ref="A${h + 1}:${last}"/>` : '') + `</worksheet>`;
  };
  const fill = c => `<fill><patternFill patternType="solid"><fgColor rgb="FF${c}"/></patternFill></fill>`;
  const files = [
    ['[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
    ['_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${XE(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd-mm-yyyy"/></numFmts><fonts count="4"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><sz val="11"/><color rgb="FF8A94A0"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts><fills count="6"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${fill('2A5D8C')}${fill('FDE2E1')}${fill('FFF1C9')}${fill('F2F4F6')}</fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="0" fillId="3" borderId="0" xfId="0" applyFill="1"/><xf numFmtId="0" fontId="0" fillId="4" borderId="0" xfId="0" applyFill="1"/><xf numFmtId="0" fontId="2" fillId="5" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
    ...sheets.map((s, i) => [`xl/worksheets/sheet${i + 1}.xml`, sheetXml(s)]),

  return new Blob([zipStore(files.map(([n, t]) => [n, new TextEncoder().encode(t)]))], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

let crcT = null;
function crc32(b){

}
// ZIP sin compresión: basta para que Excel, LibreOffice y Google Sheets abran el archivo.
function zipStore(files){
  const parts = [], cen = []; let off = 0;
  const d = new Date(), time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for(const [name, data] of files){
    const nm = new TextEncoder().encode(name), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x800, true); h.setUint16(8, 0, true); h.setUint16(10, time, true); h.setUint16(12, date, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), nm, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x800, true); c.setUint16(10, 0, true); c.setUint16(12, time, true); c.setUint16(14, date, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    cen.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + data.length;
  }
  const csize = cen.reduce((a, b) => a + b.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...cen, new Uint8Array(e.buffer)]);
}

function repWeeks(){
  let a = todayStr(mondayOf(ui.rep.a + 'T12:00:00')), b = todayStr(mondayOf(ui.rep.b + 'T12:00:00'));
  if(a > b) [a, b] = [b, a];
  const out = []; for(let m = a; m <= b && out.length < 53; m = addDays(m, 7)) out.push(m);
  return out;
}
function repInfo(){
  const w = repWeeks();
  return `${w.length === 1 ? '1 semana' : w.length + ' semanas'}: del lunes ${fmtD(w[0])} al viernes ${fmtD(addDays(w[w.length - 1], 4))}${w.length >= 53 ? ' (máximo un año)' : ''}.`;
}

$('#repB0').onclick = openRep;
$('#repPane').onclick = e => {

  if(t.id === 'repX'){ ui.rep = null; renderRepPane(); return; }

  }
  if(t.id === 'repGo') buildReport();
};

async function fetchRange(name, field, from, to){
  const snap = await db.collection(col(name)).where(field, '>=', from).get();
  return snap.docs.map(d => [d.id, d.data()]).filter(([, x]) => !to || String(x[field]) <= to);
}
async function buildReport(){
  if(!downloads || !db || ui.rep.busy) return;
  const weeks = repWeeks(), start = weeks[0], end = addDays(weeks[weeks.length - 1], 4);
  ui.rep.busy = true; renderRepPane();
  try{
    const [snaps, aus, loans] = await Promise.all([
      fetchRange('semanas', 'mon', start, weeks[weeks.length - 1]),
      fetchRange('ausencias', 'hasta', start),
      fetchRange('prestamos', 'date', start, end)]);
    const snapBy = new Map(snaps.map(([id, x]) => [id, x]));
    const absList = aus.map(([, a]) => a).filter(a => ISO.test(a.desde) && ISO.test(a.hasta) && a.desde <= end && a.hasta >= start);
    const loanBy = new Map(loans.map(([id, x]) => [id, x]));
    const cur = weekSnapBody();
    const who = (pid, snap) => { const p = people.get(pid); if(p) return [p.name, discOf(p)]; const n = (snap && snap.n && snap.n[pid]) || cur.n[pid]; return n || ['(persona eliminada)', '']; };
    const absOn = (pid, date) => absList.find(a => a.pid === pid && a.desde <= date && date <= a.hasta);
    const WD = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
    const resumen = [[{v:`Reporte semanal · ${floorName()}`, s:6}], [`Del ${fmtD(start)} al ${fmtD(end)}. Generado el ${fmtD(todayStr())}.`], [],
      ['Semana (lunes)', 'Día', 'Fecha', 'Turno viernes', 'Puestos ocupados', 'Puestos libres', 'Préstamos', 'Personas ausentes', ...MOT_COLS, 'Otros motivos', 'Origen del plano']];
    const ocup = [['Semana (lunes)', 'Puesto', 'Zona', ...WD, 'Origen del plano']];
    const porPer = [['Semana (lunes)', 'Persona', 'Área', ...WD]];
    for(const mon of weeks){
      const snap = snapBy.get(mon), tpl = snap && snap.s ? snap.s : cur.s, origin = snap && snap.s ? 'Registro de esa semana' : 'Plano actual (sin registro de esa semana)';
      const fri = addDays(mon, 4), fd = groupOf(new Date(fri + 'T12:00:00')) === 'A' ? VA : VB;
      const dayIdx = [0, 1, 2, 3, fd], seatsW = Object.entries(tpl).sort((x, y) => (parseInt(x[1][0]) || 0) - (parseInt(y[1][0]) || 0) || String(x[1][0]).localeCompare(String(y[1][0])));
      const perRow = new Map();
      const cellP = (pid, i) => { if(!perRow.has(pid)) perRow.set(pid, Array(5).fill(null)); return perRow.get(pid); };
      const stats = WD.map(() => ({occ:0, free:0, loan:0}));
      for(const [sid, row] of seatsW){
        const cells = dayIdx.map((d, i) => {
          const date = addDays(mon, i), base = row[2 + d] || '', ab = base && absOn(base, date), loan = loanBy.get(date + '_' + sid);
          if(loan && loan.pid && (!base || ab)){
            stats[i].occ++; stats[i].loan++;
            cellP(loan.pid)[i] = {v:`P${row[0]} (préstamo)`, s:4};
            if(base) cellP(base)[i] = {v:ab.motivo || 'Ausente', s:3};
            return {v:`${who(loan.pid, snap)[0]} (préstamo${base ? ' de ' + who(base, snap)[0] : ''})`, s:4};
          }
          if(ab){ stats[i].free++; cellP(base)[i] = {v:ab.motivo || 'Ausente', s:3}; return {v:`Libre · ${who(base, snap)[0]}: ${ab.motivo || 'ausente'}`, s:3}; }
          if(base){ stats[i].occ++; cellP(base)[i] = `P${row[0]}`; return who(base, snap)[0]; }
          stats[i].free++; return {v:'Libre', s:5};
        });
        ocup.push([{d:mon}, /^\d+$/.test(row[0]) ? +row[0] : row[0], row[1], ...cells, origin]);
      }
      // Ausentes sin puesto asignado también aparecen en el reporte.
      for(let i = 0; i < 5; i++){ const date = addDays(mon, i); for(const a of absList) if(a.desde <= date && date <= a.hasta){ const r = cellP(a.pid); if(!r[i]) r[i] = {v:a.motivo || 'Ausente', s:3}; } }
      for(let i = 0; i < 5; i++){
        const date = addDays(mon, i), out = absList.filter(a => a.desde <= date && date <= a.hasta), pids = new Set(out.map(a => a.pid));
        const byM = m => new Set(out.filter(a => a.motivo === m).map(a => a.pid)).size;
        resumen.push([{d:mon}, WD[i], {d:date}, i === 4 ? 'Viernes ' + (fd === VA ? 'A' : 'B') : '', stats[i].occ, stats[i].free, stats[i].loan, pids.size, ...MOT_COLS.map(byM), new Set(out.filter(a => !MOT_COLS.includes(a.motivo)).map(a => a.pid)).size, origin]);
      }
      for(const [pid, r] of [...perRow].sort((x, y) => who(x[0], snap)[0].localeCompare(who(y[0], snap)[0], 'es'))){
        const [n, disc] = who(pid, snap);
        porPer.push([{d:mon}, n, disc, ...r.map(c => c ?? '')]);
      }
    }
    const ausRows = [['Persona', 'Área', 'Motivo', 'Desde', 'Hasta', 'Días hábiles en el período']];
    const bizDays = a => { let n = 0; for(let d = a.desde < start ? start : a.desde; d <= (a.hasta > end ? end : a.hasta); d = addDays(d, 1)){ const w = new Date(d + 'T12:00:00').getDay(); if(w >= 1 && w <= 5) n++; } return n; };
    for(const a of [...absList].sort((x, y) => x.desde.localeCompare(y.desde))){ const [n, disc] = who(a.pid); ausRows.push([n, disc, {v:a.motivo || 'Otro', s:3}, {d:a.desde}, {d:a.hasta}, bizDays(a)]); }
    if(ausRows.length === 1) ausRows.push(['Nadie estuvo ausente en este período.']);
    const wk = weeks.length === 1 ? `semana ${start}` : `${start} a ${weeks[weeks.length - 1]}`;
    const blob = xlsxBlob([
      {name:'Resumen', rows:resumen, head:3, widths:[14, 11, 12, 13, 10, 10, 10, 11, 11, 11, 9, 10, 34]},
      {name:'Ocupación por puesto', rows:ocup, widths:[14, 8, 16, 30, 30, 30, 30, 30, 34]},
      {name:'Asistencia por persona', rows:porPer, widths:[14, 28, 18, 16, 16, 16, 16, 16]},
      {name:'Ausencias', rows:ausRows, widths:[28, 18, 16, 12, 12, 12]},
    ]);
    await downloads.save({filename:`Reporte ${floorName()} ${wk}.xlsx`, data:blob});
    toast('Reporte descargado');
  }catch(e){ if(!(e && e.code === 'declined')) toast('No se pudo preparar el reporte. Inténtalo de nuevo.'); }
  if(ui.rep){ ui.rep.busy = false; renderRepPane(); }
}

// ---------- solicitudes de administración ----------
// Cualquiera con acceso de Colaborador escribe solo su propia solicitud (solicitudes/<su id>).
// Solo el dueño de la app escribe la respuesta (decisiones/<id>): lo exige el servidor, no solo esta pantalla.
// El permiso real de administrador es el acceso de Editor, que el dueño da en el menú Compartir.
let reqs = new Map(), decs = new Map(), myReq = null, myDec = null, reqNames = {};
function reqState(r, d){ return !r ? 'none' : d && d.at >= r.at ? d.estado : 'pendiente'; }
function subscribeReqs(){
  if(!db || !meId) return;
  if(ui.isOwner){
    db.collection('solicitudes').onSnapshot(s => { reqs = new Map(s.docs.map(x => [x.id, x.data()])); resolveReqNames(); scheduleRender(); }, () => {});
    db.collection('decisiones').onSnapshot(s => { decs = new Map(s.docs.map(x => [x.id, x.data()])); scheduleRender(); }, () => {});
  } else if(!ui.isAdmin){
    db.doc('solicitudes/' + meId).onSnapshot(s => { myReq = s.exists ? s.data() : null; scheduleRender(); }, () => {});
    db.doc('decisiones/' + meId).onSnapshot(s => { myDec = s.exists ? s.data() : null; scheduleRender(); }, () => {});
  }
}
async function resolveReqNames(){
  const ids = [...reqs.keys()].filter(id => !(id in reqNames)); if(!ids.length || !user) return;
  const ps = await user.profiles(ids); for(const id of ids) reqNames[id] = (ps[id] && ps[id].name) || '';
  scheduleRender();
}
const reqWho = id => reqNames[id] || (reqs.get(id) || {}).nombre || 'Persona sin nombre visible';
function pendingReqs(){ return [...reqs].filter(([id, r]) => reqState(r, decs.get(id)) === 'pendiente'); }
function fmtWhen(iso){ const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('es-CL', {day:'numeric', month:'short'}) + ' ' + d.toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit'}); }
function renderReqPane(){
  const pane = $('#reqPane');
  if(!ui.req){ pane.hidden = true; return; }
  if(!pane.hidden && pane.contains(document.activeElement) && /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)) return;
  let body = '';
  if(ui.isOwner){
    const list = [...reqs].sort((a, b) => String(b[1].at).localeCompare(String(a[1].at)));
    body = `<p class="hint" style="margin:2px 0 10px">Solo tú, como dueño de la app, puedes aprobar o rechazar. Al aprobar, da a esa persona acceso de <b>Editor</b> en el menú <b>Compartir</b> de claude.ai: ese acceso es el que activa las funciones de administración.</p>`
      + (list.length ? list.map(([id, r]) => {
        const st = reqState(r, decs.get(id)), who = esc(reqWho(id));
        return `<div class="reqrow"><div class="reqh"><b>${who}</b><span class="reqst ${st}">${st === 'pendiente' ? 'Pendiente' : st === 'aprobada' ? 'Aprobada' : 'Rechazada'}</span></div>
          <div class="hint" style="margin:2px 0">Pedida el ${fmtWhen(r.at)}${r.motivo ? ' · “' + esc(r.motivo) + '”' : ''}</div>
          ${st === 'aprobada' ? `<div class="hint" style="margin:2px 0;color:var(--ink)">Siguiente paso: en claude.ai abre <b>Compartir</b> y cambia el acceso de ${who} a <b>Editor</b>.</div>` : ''}
          <div class="btns">${st !== 'aprobada' ? `<button class="primary" data-rok="${esc(id)}">Aprobar</button>` : ''}${st !== 'rechazada' ? `<button data-rno="${esc(id)}">${st === 'aprobada' ? 'Revocar' : 'Rechazar'}</button>` : ''}<button class="link" data-rdel="${esc(id)}">Borrar</button></div></div>`;
      }).join('') : '<p>No hay solicitudes.</p>');
  } else {
    const st = reqState(myReq, myDec);
    if(st === 'pendiente') body = `<p>Enviaste tu solicitud (${fmtWhen(myReq.at)}) y está esperando la respuesta del dueño de la app.</p><div class="btns"><button id="reqCancel">Cancelar solicitud</button></div>`;
    else if(st === 'aprobada') body = `<p><b>Tu solicitud fue aprobada.</b> El dueño te dará acceso de Editor en claude.ai. Cuando lo tengas, recarga la página y verás las opciones de administración.</p>`;
    else body = `${st === 'rechazada' ? `<p><b>Tu solicitud anterior fue rechazada</b> (${fmtWhen(myDec.at)}). Puedes enviar una nueva.</p>` : ''}
      <p style="margin-top:0">Administración permite fijar y liberar puestos, ordenar el plano, editar el equipamiento y crear pisos. Solo el dueño de la app puede aprobarla.</p>
      <label for="reqMot" class="hint">¿Para qué la necesitas? (opcional)</label><textarea id="reqMot" rows="2" maxlength="200" style="width:100%;margin:4px 0 8px" placeholder="Ej.: soy el encargado de puestos de Oficina A"></textarea>
      <div class="btns"><button class="primary" id="reqSend">Enviar solicitud</button></div>`;
  }
  pane.innerHTML = `<section class="admbox"><h2>${ui.isOwner ? 'Solicitudes de administración' : 'Solicitar administración'}<span style="flex:1"></span><button id="reqX" aria-label="Cerrar">✕</button></h2>${body}</section>`;
