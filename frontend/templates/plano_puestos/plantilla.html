$('#reqPane').onclick = e => {
  const t = e.target.closest('button'); if(!t) return;
  const now = new Date().toISOString();
  const fail = err => { if(err && (err.code === 'not_granted' || err.code === 'invalid_argument')) toast(ui.isOwner ? 'No se pudo guardar la respuesta.' : 'Tu acceso es solo de lectura. Pide al dueño acceso de Colaborador para poder enviar la solicitud.'); else writeErr(err); };
  if(t.id === 'reqX'){ ui.req = false; renderReqPane(); return; }
  if(t.id === 'reqSend'){ const m = ($('#reqMot').value || '').trim().slice(0, 200); db.doc('solicitudes/' + meId).set({at:now, motivo:m}).then(() => toast('Solicitud enviada al dueño de la app')).catch(fail); return; }
  if(t.id === 'reqCancel'){ db.doc('solicitudes/' + meId).delete().then(() => toast('Solicitud cancelada')).catch(fail); return; }
  if(!ui.isOwner) return;
  if(t.dataset.rok){ db.doc('decisiones/' + t.dataset.rok).set({estado:'aprobada', at:now}).then(() => toast('Aprobada. Ahora dale acceso de Editor en Compartir.')).catch(fail); return; }
  if(t.dataset.rno){ db.doc('decisiones/' + t.dataset.rno).set({estado:'rechazada', at:now}).then(() => toast('Solicitud rechazada')).catch(fail); return; }
  if(t.dataset.rdel){ const id = t.dataset.rdel; Promise.all([db.doc('solicitudes/' + id).delete(), db.doc('decisiones/' + id).delete()]).then(() => toast('Solicitud borrada')).catch(fail); }
};

// Arma una hoja horizontal: el plano a la izquierda y la tabla de ocupantes por día a la derecha.
const PRN_CSS = `.psheet{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#17212b;background:#fff}
.psheet header{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid #17212b;padding-bottom:4px;margin-bottom:6px}

.pplan svg{width:100%;height:auto;display:block}

function sharedSeat(sid){ return new Set(ALL.map(d => dayOf(sid, d)).filter(Boolean)).size >= 2; }
function printSheetHTML(){
  const list = seats(), wk = weekStart(), fri = addDays(wk, 4), g = groupOf(new Date(fri + 'T12:00:00'));
  const cell = (p) => p ? esc(pname(p)) : '';
  const rows = list.map(s => {
    const reserved = isAdm(s.id) && !ALL.some(d => dayOf(s.id, d)) && s.note;
    const td = [0, 1, 2, 3].map(d => reserved ? `<td class="res">${esc(s.note.replace(/^Reservado:\s*/i, ''))}</td>` : `<td>${cell(dayOf(s.id, d))}</td>`);
    const a = dayOf(s.id, VA), b = dayOf(s.id, VB);
    td.push(reserved ? `<td class="res">${esc(s.note.replace(/^Reservado:\s*/i, ''))}</td>` : a === b ? `<td>${cell(a)}</td>` : `<td class="vi">${a || b ? `A: ${a ? esc(shortName(pname(a))) : '—'} · B: ${b ? esc(shortName(pname(b))) : '—'}` : ''}</td>`);
    return `<tr class="${sharedSeat(s.id) ? 'sh' : ''}"><td>${esc(s.num)}</td>${td.join('')}</tr>`;
  }).join('');
  // Copia del plano con los estilos ya aplicados (así no depende del CSS de la app ni repite ids).
  const clone = svg.cloneNode(true), src = [...svg.querySelectorAll('*')], dst = [...clone.querySelectorAll('*')];
  const PROPS = ['fill', 'fill-opacity', 'stroke', 'stroke-width', 'stroke-opacity', 'stroke-dasharray', 'opacity', 'font-size', 'font-weight', 'font-family', 'text-anchor', 'dominant-baseline', 'display'];
  src.forEach((el, i) => { const cs = getComputedStyle(el); dst[i].setAttribute('style', PROPS.map(p => `${p}:${cs.getPropertyValue(p)}`).join(';')); });
  clone.querySelectorAll('.nm,.lock,.ghost,.ping').forEach(n => n.remove());
  // En la hoja, el color dice solo una cosa: naranja = puesto compartido por dos o más personas.
  const PAL = {sh:['#fbe7bf', '#a7751a', '#e7b54d', '#3d2a06'], occ:['#dbe7f3', '#2a5d8c', '#2a5d8c', '#ffffff'], free:['#eef8f1', '#2f8a57', '#e3f4ea', '#1f6b41']};
  clone.querySelectorAll('[data-seat]').forEach(g => {
    const sid = g.getAttribute('data-seat'), k = sharedSeat(sid) ? 'sh' : ALL.some(d => dayOf(sid, d)) ? 'occ' : 'free', [desk, line, chair, txt] = PAL[k];
    g.querySelectorAll('.desk').forEach(n => n.setAttribute('style', `${n.getAttribute('style')};fill:${desk};stroke:${line};opacity:1`));
    g.querySelectorAll('.chair-b').forEach(n => n.setAttribute('style', `${n.getAttribute('style')};fill:#ffffff;opacity:1`));
    g.querySelectorAll('.chair').forEach(n => n.setAttribute('style', `${n.getAttribute('style')};fill:${chair};stroke:${line};opacity:1`));
    g.querySelectorAll('.num').forEach(n => n.setAttribute('style', `${n.getAttribute('style')};fill:${txt}`));
  });
  clone.querySelectorAll('[id]').forEach(n => n.removeAttribute('id')); clone.removeAttribute('id'); clone.removeAttribute('class');

seats = function(){

seatBox = function(s){
  if(s.kind === 'area') return {x0:s.x - s.w / 2, y0:s.y - s.h / 2, x1:s.x + s.w / 2, y1:s.y + s.h / 2};
  const {dw, dd} = deskOf(s), [vx, vy] = VEC[s.dir || 'R'], h = G.chair / 2, far = h + dd;
  const xs = [s.x - h, s.x + h, s.x + vx * far + (vy ? dw / 2 : 0), s.x + vx * far - (vy ? dw / 2 : 0)];
  const ys = [s.y - h, s.y + h, s.y + vy * far + (vx ? dw / 2 : 0), s.y + vy * far - (vx ? dw / 2 : 0)];
  return {x0:Math.min(...xs), y0:Math.min(...ys), x1:Math.max(...xs), y1:Math.max(...ys)};
};

// Nombre + primer apellido, sin cortar partículas: "Ana María de la Fuente" → ["Ana", "de la Fuente"].
const PARTS = new Set(['de', 'del', 'la', 'las', 'los', 'y', 'van', 'von', 'da', 'di']);
function nameLines(n){
  const t = String(n).trim().split(/\s+/);
  if(t.length <= 2) return t;
  let i = t.length >= 4 ? 2 : 1;
  if(i === 2 && PARTS.has(t[1].toLowerCase())) i = 1;
  let j = i; while(j < t.length - 1 && PARTS.has(t[j].toLowerCase())) j++;
  return [t[0], t.slice(i, j + 1).join(' ')];
}
// Nombre en una o dos líneas que quepan en el ancho dado.
function fitLines(names, aus, owners, width){
  let lines = [], cls = 'nm';
  if(!names.length && aus && owners.length){ lines = ['Ausente', shortName(pname(owners[0])).split(' ')[0]]; cls = 'nm aus'; }
  else if(names.length === 1) lines = nameLines(names[0]);
  else if(names.length === 2) lines = names.map(n => n.split(' ')[0]);
  else if(names.length > 2) lines = [names.length + ' pers.'];
  const W = 0.52, longest = Math.max(1, ...lines.map(l => l.length));
  const fs = Math.max(5.4, Math.min(7.6, width / (longest * W)));
  const maxc = Math.max(3, Math.floor(width / (fs * W)));
  return {cls, fs, cut:lines.some(l => l.length > maxc), lines:lines.map(l => l.length > maxc ? l.slice(0, maxc - 1) + '…' : l)};
}
function nameText(t, x, y, rot){
  const tr = rot ? ` transform="rotate(-90 ${x.toFixed(1)} ${y.toFixed(1)})"` : '';
  return t.lines.map((l, i) => `<text class="${t.cls}" x="${x.toFixed(1)}" y="${(y + (i - (t.lines.length - 1) / 2) * t.fs * 1.18 + t.fs * 0.34).toFixed(1)}" style="font-size:${t.fs.toFixed(2)}px"${tr}>${esc(l)}</text>`).join('');
}
seatSVG = function(s, hl){

  const cls = ['st', area ? 'area' : '', st.cls, st.aus ? 'aus' : '', st.loan ? 'loan' : '', isAdm(s.id) ? 'adm' : '', hl.has(s.id) ? 'hl' : '', ui.sel === s.id ? 'sel' : '', dim ? 'dim' : ''].filter(Boolean).join(' ');
  const names = st.ids.map(pname);
  let o = `<g data-seat="${esc(s.id)}" class="${cls}" tabindex="0" role="button" aria-label="Puesto ${esc(s.num)}${area ? ' ' + esc(s.label || '') : ''}${names.length ? ', ' + esc(names.join(', ')) : ', libre'}">`;
  // Esquinas donde van las marcas: [x, y] de la marca de fijado, del aviso de inventario, de la nota y del candado.
  let adm, warn, note, lock;
  if(area){
    const x0 = s.x - s.w / 2, y0 = s.y - s.h / 2;
    o += `<rect class="desk zone" x="${x0 + 1}" y="${y0 + 1}" width="${s.w - 2}" height="${s.h - 2}" rx="7"/>`;
    for(const c of s.chairs || []){
      const h = G.chair / 2;
      o += `<g class="furn-l" transform="translate(${c.x},${c.y}) rotate(${ANG[c.dir]})"><rect x="${h}" y="${-c.dw / 2 + .6}" width="${c.dd - .6}" height="${c.dw - 1.2}" rx="2.5"/><circle r="9"/></g>`;
    }
    o += `<text class="zt" x="${x0 + 9}" y="${y0 + 14}">${esc(s.label || '')}</text><text class="zs" x="${x0 + 9}" y="${y0 + 23}">${esc(s.sub || '')}</text>`;
    o += `<circle class="chair" cx="${x0 + s.w - 14}" cy="${y0 + 14}" r="9"/><text class="num" x="${x0 + s.w - 14}" y="${y0 + 14}">${esc(s.num)}</text>`;
    const t = fitLines(names, st.aus, st.owners, s.w - 30);
    if(t.lines.length){ t.fs = Math.min(10, t.fs * 1.3); o += `<rect class="pill" x="${s.x - s.w / 2 + 14}" y="${s.y + 2}" width="${s.w - 28}" height="${t.lines.length * t.fs * 1.18 + 7}" rx="5"/>` + nameText(t, s.x, s.y + 5.5 + t.lines.length * t.fs * 0.59); }
    adm = [x0 + 9, y0 + s.h - 9]; warn = [x0 + s.w - 30, y0 + 8]; note = [x0 + s.w - 5, y0 + 5]; lock = [x0 + s.w - 11, y0 + s.h - 11];
  } else {
    const {dw, dd} = deskOf(s), dir = s.dir || 'R', [vx, vy] = VEC[dir], h = G.chair / 2, r = 10;
    o += `<g transform="translate(${s.x},${s.y}) rotate(${ANG[dir]})">`;
    o += `<rect class="desk" x="${h}" y="${-dw / 2 + .6}" width="${dd - .6}" height="${dw - 1.2}" rx="3"/>`;
    o += `<rect class="mon" x="${h + dd - 3}" y="-8" width="1.5" height="16" rx=".75"/>`;
    o += `<path class="back" d="M${-r * .55} ${-r * .92}Q${-r * 1.55} 0 ${-r * .55} ${r * .92}"/>`;
    o += `<circle class="chair" r="${r}"/></g>`;
    o += `<text class="num" x="${s.x}" y="${s.y}">${esc(s.num)}</text>`;
    // Nombre al centro de la mesa (un poco hacia la silla, lejos del monitor). En las mesas que miran a los
    // lados se escribe a lo largo de la mesa: así cabe el nombre completo y todas las filas se leen igual.
    const mid = h + dd / 2 - 2, dcx = s.x + vx * mid, dcy = s.y + vy * mid, rot = !!vx;
    o += nameText(fitLines(names, st.aus, st.owners, dw - 10), dcx, dcy, rot);
    const far = h + dd - 5;
    lock = [s.x + vx * far + (vx ? 0 : dw / 2 - 7), s.y + vy * far + (vy ? 0 : dw / 2 - 7)];
    adm = [s.x - h + 3.5, s.y + h - 3.5]; warn = [s.x - h + 2, s.y - h]; note = [s.x + h - 3, s.y - h + 3];

  if(st.cls !== 'free') o += `<use href="#lk" class="lock" x="${lock[0] - 3}" y="${lock[1] - 3.6}" width="6" height="7.2"/>`;

  }
  if(s.note) o += `<circle class="note" cx="${note[0]}" cy="${note[1]}" r="2.6"><title>${esc(s.note)}</title></circle>`;
  return o + '</g>';
};

// "Ordenar plano" en Piso 5: número, zona y nota, y quitar o restaurar puestos (no mover, girar ni agregar).
{

        ${readOnly() ? '' : '<div class="btns"><button class="primary" id="gAdd">Agregar puesto</button></div>'}</section>`;
      pane.hidden = false;
      return;
    }
    basePane();
    const s = ui.sel && seatById(ui.sel);
    if(!fixedPlan() || !s || pane.hidden || readOnly() || !ui.isAdmin) return;
    const busy = ALL.some(d => dayOf(s.id, d)), sec = pane.querySelector('section');
    if(!sec) return;
    sec.insertAdjacentHTML('beforeend', `<h3>Puesto en el plano</h3>` + (busy
      ? `<p class="hint" style="margin:0 0 6px">Para eliminar este puesto, primero libéralo toda la semana.</p><div class="btns"><button class="danger" disabled>Eliminar puesto</button></div>`
      : ui.confirm === 'pdel:' + s.id
        ? `<div class="btns"><span style="align-self:center">¿Eliminar el puesto ${esc(s.num)}? Queda en gris y se puede volver a agregar.</span><button class="danger" id="pDelOk">Sí, eliminar</button><button id="pDelNo">No</button></div>`
        : `<div class="btns"><button class="danger" id="pDel">Eliminar puesto</button></div>`));
  };
  document.addEventListener('click', e => {
    const t = e.target.closest('#gX,#gAdd,#pDel,#pDelOk,#pDelNo');
    if(!t) return;
    const sid = t.id.startsWith('g') ? ui.gsel : ui.sel;
    const s = LAYOUT.seats.find(x => x.id === sid);
    if(t.id === 'gX'){ ui.gsel = null; render(); }
    else if(t.id === 'pDel'){ ui.confirm = 'pdel:' + sid; renderSeatPane(); }
    else if(t.id === 'pDelNo'){ ui.confirm = null; renderSeatPane(); }
    else if(t.id === 'pDelOk'){
      if(ALL.some(d => dayOf(sid, d))){ ui.confirm = null; renderSeatPane(); return toast(`Libera el puesto ${s ? s.num : ''} antes de eliminarlo.`); }
      const ref = dref('plano', sid);
      serial(ref.path, () => ref.set({deleted:true})).then(() => toast(`Puesto ${s ? s.num : ''} eliminado`)).catch(writeErr);
      ui.sel = null; ui.confirm = null; ui.gsel = sid; render();
    }
    else if(t.id === 'gAdd'){
      const ref = dref('plano', sid);
      serial(ref.path, () => ref.delete()).then(() => toast(`Puesto ${s ? s.num : ''} agregado`)).catch(writeErr);
      ui.gsel = null; ui.sel = sid; render();
    }
  });

  // Hoja para imprimir: los puestos con nombre propio (55 = I+D) lo muestran en los días sin asignar.
  const baseSheet = printSheetHTML;
  printSheetHTML = function(){
    const html = baseSheet(), named = seats().filter(s => s.label);
    if(!named.length) return html;
    const t = document.createElement('template'); t.innerHTML = html;
    for(const tr of t.content.querySelectorAll('.ptab tbody tr')){
      const s = named.find(x => x.num === tr.cells[0].textContent.trim());
      if(!s) continue;
      tr.cells[0].title = s.label;
      for(const td of [...tr.cells].slice(1)) if(!td.textContent.trim()){ td.textContent = s.label; td.className = 'res'; }
    }
    return t.innerHTML;
  };

  const baseRender = render;
  render = function(){
    baseRender();
    const b = $('#modeB');
    b.textContent = fixedPlan() ? 'Datos de los puestos' : 'Ordenar plano';
    b.title = fixedPlan() ? 'Cambiar número, zona o nota de un puesto, o quitarlo (el plano de Piso 5 es fijo)' : 'Mover, girar, agregar o quitar puestos del plano';
  };
}

// ---------- enlace con Personal GING (adaptar.py pega esto antes del inicio de la app) ----------
// Cada persona del plano se enlaza con su ficha de Personal GING por usuario. Si no tiene usuario
// guardado, se busca por nombre (igual, o todas sus palabras dentro del nombre completo y sin dudas).
// Cargo, disciplina, rol, CC y modalidad vienen de Personal GING y se cambian allá, no en el plano.
// Quien no está en Personal GING queda como "Externo". El enlace se puede fijar a mano en "Editar".
// Personal GING es la lista maestra: quien está allá y falta en el plano se agrega solo (syncGing).
let GING = null;              // usuario → ficha
let rawPeople = new Map();    // personas tal como vienen de los datos, sin el perfil de Personal GING
let peopleReady = false;      // ya llegaron las personas guardadas (antes de eso no se sabe quién falta)
const gingCreating = new Set();
const gnorm = s => norm(s || '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function gingMatch(p){
  if(!GING) return null;
  if(p.usuario === '-') return null;                        // marcado a mano como externo
  if(p.usuario) return GING.get(p.usuario) || null;
  const n = gnorm(p.name), exact = [...GING.values()].filter(r => gnorm(r.nombre) === n);
  if(exact.length === 1) return exact[0];
  const t = n.split(' ');
  if(t.length < 2) return null;
  const sub = [...GING.values()].filter(r => { const rt = new Set(gnorm(r.nombre).split(' ')); return t.every(w => rt.has(w)); });
  return sub.length === 1 ? sub[0] : null;
}
function enrichPeople(m){
  if(m !== rawPeople) peopleReady = true;   // llamada desde los datos, no desde la carga de personal.json
  rawPeople = m;
  if(!GING) return m;
  syncGing();
  const out = new Map();
  for(const [pid, p] of m){
    const r = gingMatch(p);
    out.set(pid, r
      ? {...p, ging:r, cargo:r.cargo || p.cargo, disc:r.disciplina || p.disc}
      : {...p, ext:true});
  }
  return out;
}
// Agrega al plano a quien está en Personal GING y todavía no tiene su persona en el plano,
// ya enlazada por usuario. Sin puesto; "necesita puesto" salvo que su modalidad sea 0/5 (teletrabajo).
function syncGing(){
  if(!GING || !peopleReady || !db) return;
  const enlazados = new Set();
  for(const p of rawPeople.values()){ const r = gingMatch(p); if(r) enlazados.add(r.usuario); }
  const faltan = [...GING.values()].filter(r => !enlazados.has(r.usuario) && !gingCreating.has(r.usuario));
  if(!faltan.length) return;
  for(const r of faltan){
    gingCreating.add(r.usuario);
    savePerson(uid('p_'), {name:r.nombre, usuario:r.usuario, needs:r.modalidad !== '0/5', note:''});
  }
  toast(faltan.length === 1 ? `${faltan[0].nombre} agregado desde Personal GING` : `${faltan.length} personas agregadas desde Personal GING`);
}
(async () => {
  try{
    const res = await fetch('personal.json', {credentials:'same-origin'});
    if(!res.ok) return;
    const list = (await res.json()).personal || [];
    GING = new Map(list.filter(r => r.usuario).map(r => [r.usuario, r]));
    // Las disciplinas de Personal GING se suman a las de la app (filtros y ficha).
    for(const r of list) if(r.disciplina && !DISCS.includes(r.disciplina)) DISCS.push(r.disciplina);
    people = enrichPeople(rawPeople); bump(); scheduleRender();
  }catch(e){ /* abierto fuera del panel: sin enlace */ }
})();

{
  const baseProf = profDL;
  profDL = function(p){
    const g = p.ging;
    const extra = g
      ? `<dt>Personal GING</dt><dd>${esc(g.nombre)}${g.rol ? ' · ' + esc(g.rol) : ''}${g.cc ? ' · CC ' + esc(g.cc) : ''}${g.modalidad ? ' · modalidad ' + esc(g.modalidad) : ''}</dd>`
      : p.ext ? '<dt>Personal GING</dt><dd>Externo: no está en Personal GING</dd>' : '';
    const base = baseProf(p);
    if(!extra) return base;
    return base.startsWith('<dl>') ? base.replace('<dl>', '<dl>' + extra) : `<dl>${extra}</dl>`;
  };
  const baseText = personText;
  personText = function(p){ return baseText(p) + ' ' + (p.ging ? norm(p.ging.usuario + ' ' + p.ging.nombre) : p.ext ? 'externo' : ''); };

  const baseRP = renderPeople;
  renderPeople = function(){

    for(const b of document.querySelectorAll('#plist .pmain[data-pick]')){

    const now = g ? `Enlazada con <b>${esc(g.nombre)}</b> (${esc(g.usuario)})${auto ? ', por nombre' : ''}.` : 'No está enlazada: aparece como externa.';

      <div class="hint">${now}${g ? ' Cargo y disciplina se cambian en Personal GING.' : ''}</div></div>`);
    if(g) for(const id of ['pe_disc', 'pe_cargo']){ const el = $('#' + id); if(el){ el.disabled = true; el.title = 'Viene de Personal GING'; } }
  };
}

  $('#thin').setAttribute('d', a.thin || ''); $('#walls').setAttribute('d', a.walls || '');
  $('#bgfills').innerHTML = a.fills; $('#doors').innerHTML = a.doors || ''; $('#labels').innerHTML = a.labels;

  else { img.removeAttribute('href'); img.setAttribute('hidden', ''); }
}

(async () => {
  const cl = window.claude;
  if(!cl || !cl.use){ offline(); return; }
  const [d, u, dl, as] = await Promise.all([cl.use('db'), cl.use('user'), cl.use('downloads'), cl.use('assets')]);
  downloads = dl; user = u; assets = as;
  if(!d){ offline(); render(); return; }
  db = d;
  if(u){
    meId = await u.id();
    ui.isOwner = await u.isOwner();
    ui.canWriteKnown = await u.can('data.write');
    if(ui.canWriteKnown === false) ui.canWrite = false;
    // Administración abierta: todo el que puede editar datos (Colaborador o más) tiene las opciones de administración.
    // Las reglas de la base de datos ya no reservan colecciones para Editores. Solo los Lectores quedan fuera.
    ui.isAdmin = ADMIN_ABIERTA ? (await u.canEdit()) || ui.canWriteKnown !== false : await u.canEdit();
  }
  renderFloorSel();
  subscribeFloor();
  subscribeReqs();
  db.collection('admin-pisos').onSnapshot(s => {
    floors = new Map(s.docs.map(x => [x.id, x.data()]));
    if(FID !== 'p5' && !floors.has(FID)){ switchFloor('p5'); return; }
    if(FID !== 'p5') applyFloorMeta();
    renderFloorSel(); scheduleRender();
  }, failDb);
  let saved = null; try{ saved = localStorage.getItem('piso'); }catch(e){}
  if(saved && saved !== 'p5') setTimeout(() => { if(floors.has(saved)) switchFloor(saved); }, 1500);
  setInterval(() => { renderRooms(); if(ui.room) renderRoomPane(); }, 60000);
  const s = $('#sync'); s.textContent = 'Guardado en este navegador'; s.classList.add('on');
  render();
})();
function failDb(e){ if(e && e.code === 'revoked'){ db = null; offline(); render(); } }
function subscribeFloor(){
  unsubs.forEach(u => { try{ u(); }catch(e){} }); unsubs = [];
  const on = (name, set) => unsubs.push(db.collection(col(name)).onSnapshot(s => {
    set(new Map(s.docs.map(x => [x.id, x.data()]))); bump();
    if(pdrag && pdrag.active) return; // no redibujar mientras se arrastra
    if(gesture && gesture.type === 'seat') return;
    scheduleRender();
  }, failDb));
  on('plano', m => plano = m);
  on('asig', m => asig = m);
  on('fijos', m => fijos = m);
  on('personas', m => people = enrichPeople(m));
  on('inventario', m => inv = m);
  unsubs.push(dref('config', 'viernes').onSnapshot(s => {
    const d = s.exists ? s.data() : null;
    vcfg = d && /^\d{4}-\d{2}-\d{2}$/.test(d.ref) && (d.grp === 'A' || d.grp === 'B') ? {ref:d.ref, grp:d.grp} : {ref:'2026-09-21', grp:'A'};
    bump(); scheduleRender();
  }, failDb));
  unsubs.push(dref('config', 'seguridad').onSnapshot(s => { segCfg = s.exists ? s.data() : null; scheduleRender(); }, failDb));
  unsubs.push(db.collection(col('salas')).where('date', '>=', todayStr()).onSnapshot(s => {
    salas = new Map(s.docs.map(x => [x.id, x.data()]));
    if(pdrag && pdrag.active) return;
    scheduleRender();
  }, failDb));
  unsubs.push(db.collection(col('impresoras')).onSnapshot(s => { imp = new Map(s.docs.map(x => [x.id, x.data()])); if(pdrag && pdrag.active) return; scheduleRender(); }, failDb));
  unsubs.push(db.collection(col('banos')).onSnapshot(s => { banos = new Map(s.docs.map(x => [x.id, x.data()])); if(pdrag && pdrag.active) return; scheduleRender(); }, failDb));
  unsubs.push(db.collection(col('ascensores')).onSnapshot(s => {
    elevs = new Map(s.docs.map(x => [x.id, x.data()]));
    if(pdrag && pdrag.active) return;
    scheduleRender();
  }, failDb));
  subscribeExtra();
}
function subscribeExtra(){
  const cut = todayStr(new Date(Date.now() - 120 * 864e5));
  unsubs.push(db.collection(col('ausencias')).where('hasta', '>=', cut).onSnapshot(s => { ausencias = new Map(s.docs.map(x => [x.id, x.data()])); bump(); scheduleRender(); }, failDb));
  unsubs.push(db.collection(col('prestamos')).where('date', '>=', cut).onSnapshot(s => { prestamos = new Map(s.docs.map(x => [x.id, x.data()])); bump(); scheduleRender(); }, failDb));
}
function applyFloorMeta(){
  if(FID === 'p5'){ LAYOUT = P5.layout; ARCH = P5.arch; ROOMS = P5.rooms; ELEVS = P5.elevs; BANOS = P5.banos; PRINTERS = P5.printers; G = {...G0}; }
  else {
    const m = floors.get(FID) || {};
    LAYOUT = {w:+m.w || 1000, h:+m.h || 700, seats:[], bg:m.bg || ''}; ARCH = null; ROOMS = []; ELEVS = []; BANOS = []; PRINTERS = [];
    const k = Math.min(Math.max(+m.scale || 1, .3), 3); G = {chair:G0.chair * k, r:G0.r * k, deskD:G0.deskD * k, deskW:G0.deskW * k};
  }
  LAYOUT_IDS = new Set(LAYOUT.seats.map(s => s.id));
  drawBackground(); bump();
}
function switchFloor(fid){
  if(fid !== 'p5' && !floors.has(fid)) fid = 'p5';
  FID = fid; try{ localStorage.setItem('piso', fid); }catch(e){}
  plano = new Map(); asig = new Map(); people = new Map(); salas = new Map(); elevs = new Map(); banos = new Map(); imp = new Map(); fijos = new Map(); inv = new Map(); segCfg = null;
  Object.assign(ui, {sel:null, room:null, elev:null, pick:null, confirm:null, editPid:null, invEdit:false, mode:'asignar'});
  applyFloorMeta(); fitted = false;
  if(db) subscribeFloor();
  renderFloorSel(); render(); requestAnimationFrame(fit);
}
function renderFloorSel(){
  const sel = $('#floorSel'), list = [['p5', 'Piso 5'], ...[...floors].sort((a, b) => String(a[1].name).localeCompare(String(b[1].name), 'es')).map(([id, f]) => [id, f.name || 'Piso'])];
  const show = list.length > 1 || ui.isAdmin;
  sel.hidden = !show; $('#floorName').hidden = show;
  if(!show) return;
  sel.innerHTML = list.map(([id, n]) => `<option value="${esc(id)}" ${id === FID ? 'selected' : ''}>${esc(n)}</option>`).join('') + (ui.isAdmin && db ? '<option value="__new">+ Crear piso nuevo…</option>' : '');
}
$('#floorSel').onchange = e => {
  const v = e.target.value;
  if(v === '__new'){ e.target.value = FID; ui.admin = true; ui.newFloor = true; ui.openK['adm:Pisos'] = true; ui.mode = 'asignar'; render(); setTimeout(() => { const i = $('#nfName'); if(i) i.focus(); }, 50); return; }
  switchFloor(v);
};
function offline(){
  const n = $('#notice');
  n.textContent = 'Esta vista no está conectada a los datos del equipo. Abre la página desde claude.ai para ver y cambiar las asignaciones.';
  n.hidden = false;
  $('#sync').textContent = 'Sin conexión'; $('#sync').classList.remove('on');
}
